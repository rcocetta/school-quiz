<style>/* School-quiz page styles. System fonts only, no external requests.
   All colours and sizes live in the custom properties below. */

:root {
  color-scheme: light dark;

  /* Palette (light): warm cream paper, deep plum ink, violet action colour */
  --bg: #fff5e1;
  --blob-a: #ffe3a3;
  --blob-b: #ffd3dc;
  --surface: #ffffff;
  --ink: #2a2145;
  --ink-soft: #564b73;
  --edge: #2a2145;          /* sticker-style borders */
  --shade: #2a2145;         /* hard drop shadow */
  --primary: #5233e0;
  --on-primary: #ffffff;
  --accent: #ffc83d;        /* progress bar, highlights */
  --select-bg: #ece8ff;
  --good-bg: #d9f5e8;
  --good-ink: #065f46;
  --good-edge: #0b7a5b;
  --oops-bg: #ffe8c4;
  --oops-ink: #7a3a00;
  --oops-edge: #b45309;
  --focus: #1d4ed8;

  /* Type scale */
  --font: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --fs-small: 1rem;
  --fs-body: 1.125rem;
  --fs-lead: 1.3125rem;
  --fs-question: clamp(1.5rem, 5.5vw, 2.125rem);
  --fs-title: clamp(2rem, 9vw, 3.25rem);
  --fs-score: clamp(3rem, 16vw, 5rem);

  /* Spacing and shape */
  --gutter: 1rem;
  --gap: 1rem;
  --radius: 1.25rem;
  --tap: 3.5rem;            /* 56px, above the 48px minimum */
  --border: 3px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #19142b;
    --blob-a: #241c45;
    --blob-b: #331a3b;
    --surface: #261f3f;
    --ink: #f6f1ff;
    --ink-soft: #cfc6ea;
    --edge: #8c80c0;
    --shade: #0b0816;
    --primary: #b7aaff;
    --on-primary: #1a1236;
    --accent: #ffc83d;
    --select-bg: #3a3070;
    --good-bg: #123d31;
    --good-ink: #c4f6e0;
    --good-edge: #4ade9f;
    --oops-bg: #4a2d0a;
    --oops-ink: #ffe0b0;
    --oops-edge: #ffb454;
    --focus: #ffd666;
  }
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background-color: var(--bg);
  /* Two soft blobs in the corners: decoration only */
  background-image:
    radial-gradient(circle at 100% 0, var(--blob-a) 0 9rem, transparent 9.05rem),
    radial-gradient(circle at 0 100%, var(--blob-b) 0 8rem, transparent 8.05rem);
  background-repeat: no-repeat;
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--font);
  font-size: var(--fs-body);
  line-height: 1.5;
}

#app { min-height: 100vh; min-height: 100dvh; }

.page {
  display: flex;
  flex-direction: column;
  gap: var(--gap);
  min-height: inherit;
  max-width: 46rem;
  margin: 0 auto;
  padding: var(--gutter);
  padding-bottom: 0.5rem;
}

.screen { display: flex; flex-direction: column; gap: 1.25rem; }

h1, h2, h3, p { margin: 0; overflow-wrap: anywhere; }
h1 { font-size: var(--fs-title); line-height: 1.1; font-weight: 900; letter-spacing: -0.01em; }
h2 { font-size: var(--fs-question); line-height: 1.25; font-weight: 800; }
h3 { font-size: var(--fs-lead); font-weight: 800; }

/* Headings get focus from script on screen change; no ring needed for that */
[tabindex="-1"]:focus { outline: none; }

a { color: var(--primary); text-underline-offset: 0.2em; font-weight: 700; }

:focus-visible {
  outline: 4px solid var(--focus);
  outline-offset: 3px;
}

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  margin: -1px; padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

/* ---------- top bar: language switcher ---------- */

.topbar { display: flex; justify-content: flex-end; }

.lang-switch { display: flex; flex-wrap: wrap; gap: 0.5rem; }

.lang-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  min-height: 3rem;
  min-width: 3rem;
  padding: 0 0.9rem;
  border: var(--border) solid var(--edge);
  border-radius: 999px;
  background: var(--surface);
  color: var(--ink);
  font: inherit;
  font-size: var(--fs-small);
  font-weight: 800;
  letter-spacing: 0.04em;
  cursor: pointer;
}

.flag { font-family: "quizgen-flags", "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }

.lang-btn[aria-pressed="true"] {
  background: var(--primary);
  color: var(--on-primary);
}

/* ---------- start screen ---------- */

.hero {
  background: var(--surface);
  border: var(--border) solid var(--edge);
  border-top: 0.9rem solid var(--accent);
  border-radius: var(--radius);
  box-shadow: 0 6px 0 var(--shade);
  padding: 1.5rem 1.25rem 1.75rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}
.hero .lead { font-size: var(--fs-lead); }
.meta { color: var(--ink-soft); font-size: var(--fs-small); font-weight: 700; }
.badge-count {
  align-self: flex-start;
  padding: 0.25rem 0.9rem;
  border-radius: 999px;
  background: var(--select-bg);
  color: var(--ink);
  font-weight: 800;
  font-size: var(--fs-small);
}

/* ---------- buttons ---------- */

.btn {
  align-self: stretch;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: var(--tap);
  padding: 0.5rem 1.75rem;
  border: var(--border) solid var(--edge);
  border-radius: 999px;
  background: var(--primary);
  color: var(--on-primary);
  box-shadow: 0 4px 0 var(--shade);
  font: inherit;
  font-size: var(--fs-lead);
  font-weight: 900;
  text-align: center;
  cursor: pointer;
  transition: transform 0.08s ease, box-shadow 0.08s ease;
}
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--shade); }
.btn[disabled] {
  background: var(--surface);
  color: var(--ink-soft);
  border-style: dashed;
  box-shadow: none;
  cursor: not-allowed;
  filter: none;
}
@media (min-width: 30rem) {
  .btn { align-self: flex-start; min-width: 14rem; }
}

/* ---------- question screen ---------- */

.progress-text { font-size: var(--fs-small); font-weight: 800; color: var(--ink-soft); }
.progress {
  height: 0.9rem;
  border: 2px solid var(--edge);
  border-radius: 999px;
  background: var(--surface);
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 999px;
  transition: width 0.3s ease;
}

.question-img, .option-img, .review-img {
  display: block;
  max-width: 100%;
  height: auto;
  object-fit: contain;
  border-radius: 0.75rem;
  background: #fff;
}
.question-img { max-height: 14rem; margin: 0 auto; border: 2px solid var(--edge); }

.options { display: grid; grid-template-columns: 1fr; gap: 0.75rem; }
@media (min-width: 40rem) {
  .options { grid-template-columns: 1fr 1fr; }
}

.option {
  position: relative;
  display: flex;
  align-items: center;
  gap: 0.75rem;
  width: 100%;
  min-height: var(--tap);
  padding: 0.75rem;
  border: var(--border) solid var(--edge);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 4px 0 var(--shade);
  font: inherit;
  font-size: var(--fs-lead);
  font-weight: 700;
  text-align: left;
  cursor: pointer;
  transition: transform 0.08s ease, box-shadow 0.08s ease;
}
.option:hover { background: var(--select-bg); }
.option:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--shade); }
.option[aria-disabled="true"] { cursor: default; }
.option[aria-disabled="true"]:hover { background: var(--surface); }
.option[aria-disabled="true"]:active { transform: none; box-shadow: 0 4px 0 var(--shade); }

.option-key {
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 2rem; height: 2rem;
  border-radius: 50%;
  background: var(--select-bg);
  color: var(--ink);
  font-size: var(--fs-small);
  font-weight: 900;
}
.option-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0.5rem; overflow-wrap: anywhere; }
.option-img { max-height: 9rem; margin: 0 auto; }
.mark {
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 2rem; height: 2rem;
  border-radius: 50%;
  font-weight: 900;
  line-height: 1;
}
.mark:empty { visibility: hidden; }

/* Picture-only options sit in a grid, image on top */
.options--pictures { grid-template-columns: 1fr 1fr; }
.options--pictures .option { flex-direction: column; justify-content: flex-start; padding-top: 2.75rem; }
.options--pictures .option-key { position: absolute; top: 0.5rem; left: 0.5rem; }
.options--pictures .mark { position: absolute; top: 0.5rem; right: 0.5rem; }
.options--pictures .option-body { width: 100%; }
.options--pictures .option-img { max-height: 11rem; width: 100%; }

/* Option states. Shape differs too (solid vs dashed border, icon), not just colour. */
.option[data-state="selected"] {
  background: var(--select-bg);
  border-color: var(--primary);
  border-width: 5px;
  padding: calc(0.75rem - 2px);
}
.option[data-state="selected"] .mark { background: var(--primary); color: var(--on-primary); }

.option[data-state="right"], .option[data-state="reveal"] {
  background: var(--good-bg);
  color: var(--good-ink);
  border-color: var(--good-edge);
}
.option[data-state="right"] .mark, .option[data-state="reveal"] .mark { background: var(--good-edge); color: var(--bg); }
.option[data-state="right"] .option-key, .option[data-state="reveal"] .option-key { background: transparent; }

.option[data-state="wrong"] {
  background: var(--oops-bg);
  color: var(--oops-ink);
  border-color: var(--oops-edge);
  border-style: dashed;
}
.option[data-state="wrong"] .mark { background: var(--oops-edge); color: var(--bg); }
.option[data-state="wrong"] .option-key { background: transparent; }
@media (prefers-color-scheme: dark) {
  .option[data-state="right"] .mark, .option[data-state="reveal"] .mark,
  .option[data-state="wrong"] .mark { color: #10231c; }
}

/* Feedback panel under the options (immediate mode) */
.feedback {
  display: flex;
  gap: 0.75rem;
  padding: 1rem;
  border: var(--border) solid var(--good-edge);
  border-radius: var(--radius);
  background: var(--good-bg);
  color: var(--good-ink);
  animation: pop 0.25s ease-out;
}
.feedback--oops {
  border-color: var(--oops-edge);
  border-style: dashed;
  background: var(--oops-bg);
  color: var(--oops-ink);
}
.feedback-icon { flex: none; font-size: 1.75rem; line-height: 1.2; }
.feedback-body { display: flex; flex-direction: column; gap: 0.35rem; min-width: 0; }
.feedback-title { font-weight: 800; font-size: var(--fs-lead); }
.feedback .answer-line { font-weight: 800; }

.inline-answer { display: inline-flex; align-items: center; gap: 0.5rem; vertical-align: middle; }
.review-img { max-height: 3.5rem; width: auto; border: 2px solid var(--edge); }

@keyframes pop {
  from { transform: scale(0.96); opacity: 0.4; }
  to { transform: scale(1); opacity: 1; }
}

/* ---------- end screen ---------- */

.result {
  background: var(--surface);
  border: var(--border) solid var(--edge);
  border-top: 0.9rem solid var(--accent);
  border-radius: var(--radius);
  box-shadow: 0 6px 0 var(--shade);
  padding: 1.5rem 1.25rem;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
  text-align: center;
  align-items: center;
}
.result .btn { align-self: center; margin-top: 0.5rem; }
.score-label { font-weight: 800; color: var(--ink-soft); }
.score-value { font-size: var(--fs-score); font-weight: 900; line-height: 1; color: var(--primary); }
.score-message { font-size: var(--fs-lead); font-weight: 800; }

.review-title { margin-top: 0.5rem; }
.review-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.75rem; }
.review-item {
  display: flex;
  gap: 0.75rem;
  padding: 1rem;
  background: var(--surface);
  border: 2px solid var(--edge);
  border-radius: var(--radius);
}
.review-item .mark { margin-top: 0.1rem; }
.review-item[data-ok="true"] .mark { background: var(--good-edge); color: var(--bg); }
.review-item[data-ok="false"] .mark { background: var(--oops-edge); color: var(--bg); }
@media (prefers-color-scheme: dark) {
  .review-item .mark { color: #10231c !important; }
}
.review-body { display: flex; flex-direction: column; gap: 0.4rem; min-width: 0; }
.review-q { font-weight: 800; }
.review-line { font-size: var(--fs-body); }
.review-line strong { font-weight: 800; }
.review-explain { color: var(--ink-soft); font-size: var(--fs-small); }

/* ---------- footer ---------- */

.footer {
  margin-top: auto;
  padding: 1.25rem 0 1rem;
  text-align: center;
  font-size: var(--fs-small);
  color: var(--ink-soft);
}
.footer a { font-weight: 600; }
.noscript { padding: var(--gutter); font-size: var(--fs-lead); text-align: center; }

/* ---------- reduced motion ---------- */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
}

/* ---------- index pages (body.index) ---------- */
/* Everything below is scoped to .index / .back-link so single quiz pages are unchanged. */

.back-link {
  align-self: flex-start;
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  min-height: 3rem;
  padding: 0 1.1rem 0 0.9rem;
  border: var(--border) solid var(--edge);
  border-radius: 999px;
  background: var(--surface);
  color: var(--ink);
  font-size: var(--fs-small);
  font-weight: 800;
  text-decoration: none;
}
.back-link:hover { background: var(--select-bg); }
.back-arrow { font-size: 1.25rem; line-height: 1; }

.index-head { display: flex; flex-direction: column; gap: 0.75rem; padding: 0.5rem 0 0.5rem; }
.index-head .lead { font-size: var(--fs-lead); }
.index-main { display: flex; flex-direction: column; gap: 2rem; padding-bottom: 1rem; }
.index .section-title { font-size: var(--fs-lead); font-weight: 900; margin-bottom: 1rem; color: var(--ink-soft); }

.cards {
  list-style: none;
  margin: 0;
  padding: 0 0 0.9rem;       /* room for the stacked-folder shadow */
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 15.5rem), 1fr));
  gap: 1.5rem 1.25rem;
}

.card {
  position: relative;        /* the link's ::after stretches over this box */
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
  min-width: 0;
  min-height: 7.5rem;
  padding: 1.25rem 1.25rem 1.1rem;
  background: var(--surface);
  border: var(--border) solid var(--edge);
  border-radius: var(--radius);
  box-shadow: 0 6px 0 var(--shade);
  transition: transform 0.1s ease, box-shadow 0.1s ease;
}
.card:hover { transform: translateY(-2px); box-shadow: 0 8px 0 var(--shade); }
.card:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--shade); }

.card--quiz { border-top: 0.9rem solid var(--accent); }

/* Collections look like a stack of folders: tab on top, extra sheets underneath */
.card--collection {
  margin-top: 0.9rem;
  background: var(--select-bg);
  border-top-left-radius: 0.4rem;
  box-shadow:
    0 6px 0 var(--shade),
    0 11px 0 -3px var(--surface),
    0 14px 0 -3px var(--edge);
}
.card--collection:hover {

}
.card--collection:active { box-shadow: 0 2px 0 var(--shade), 0 5px 0 -3px var(--surface), 0 7px 0 -3px var(--edge); }
.card--collection::before {  /* the folder tab */
  content: "";
  position: absolute;
  top: calc(-0.9rem - var(--border));
  left: calc(-1 * var(--border));
  width: 38%;
  height: 0.9rem;
  background: var(--select-bg);
  border: var(--border) solid var(--edge);
  border-bottom: 0;
  border-radius: 0.6rem 0.6rem 0 0;
}

.card-title { font-size: var(--fs-lead); line-height: 1.25; font-weight: 700; }
.card-link { color: var(--ink); text-decoration: none; }
.card-link::after { content: ""; position: absolute; inset: 0; border-radius: var(--radius); }
.card-link:hover { text-decoration: underline; text-underline-offset: 0.2em; }
.card-link:focus-visible { outline: none; }
.card-link:focus-visible::after {
  outline: 4px solid var(--focus);
  outline-offset: 4px;
}
.folder { margin-right: 0.15rem; }
.card-desc { color: var(--ink-soft); font-size: var(--fs-small); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem 0.75rem; margin-top: auto; }
.chip {
  padding: 0.25rem 0.9rem;
  border-radius: 999px;
  background: var(--select-bg);
  color: var(--ink);
  font-size: var(--fs-small);
  font-weight: 700;
}
.card--collection .chip { background: var(--surface); }
.by { color: var(--ink-soft); font-size: var(--fs-small); font-weight: 700; }
.langs { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 0.4rem; }
.lang-chip {
  padding: 0.1rem 0.7rem;
  border: 2px solid var(--edge);
  border-radius: 999px;
  font-size: var(--fs-small);
  font-weight: 800;
  letter-spacing: 0.04em;
}

.empty {
  text-align: center;
  padding: 2.5rem 1.25rem;
  background: var(--surface);
  border: var(--border) dashed var(--edge);
  border-radius: var(--radius);
}
.empty-icon { font-size: 3.5rem; line-height: 1.2; }
.empty-text { font-size: var(--fs-lead); font-weight: 800; margin-top: 0.5rem; }

mallest planet in our solar system, only slightly larger than Earth's Moon.","fr":"Mercure est la plus petite planète de notre système solaire, seulement légèrement plus grande que la Lune de la Terre.","it":"Mercurio è il pianeta più piccolo del nostro sistema solare, solo leggermente più grande della Luna terrestre."},"options":[{"text":{"en":"Pluto","fr":"Pluton","it":"Plutone"},"correct":false},{"text":{"en":"Mercury","fr":"Mercure","it":"Mercurio"},"correct":true},{"text":{"en":"Mars","fr":"Mars","it":"Marte"},"correct":false},{"text":{"en":"Venus","fr":"Vénus","it":"Venere"},"correct":false}]},{"text":{"en":"Which planet is known as the Blue Planet?","fr":"Quelle planète est appelée la Planète Bleue ?","it":"Quale pianeta è chiamato il Pianeta Blu?"},"explanation":{"en":"Earth appears blue from space because about 71% of its surface is covered by water.","fr":"La Terre paraît bleue depuis l'espace car environ 71 % de sa surface est recouverte d'eau.","it":"La Terra appare blu dallo spazio perché circa il 71% della sua superficie è coperta da acqua."},"options":[{"text":{"en":"Earth","fr":"Terre","it":"Terra"},"correct":true},{"text":{"en":"Neptune","fr":"Neptune","it":"Nettuno"},"correct":false},{"text":{"en":"Uranus","fr":"Uranus","it":"Urano"},"correct":false},{"text":{"en":"Saturn","fr":"Saturne","it":"Saturno"},"correct":false}]},{"text":{"en":"Which planet spins on its side?","fr":"Quelle planète tourne sur le côté ?","it":"Quale pianeta ruota su un lato?"},"explanation":{"en":"Uranus rotates on its side with an axial tilt of about 98 degrees, making it appear to roll around the Sun.","fr":"Uranus tourne sur le côté avec une inclinaison axiale d'environ 98 degrés, ce qui lui donne l'air de rouler autour du Soleil.","it":"Urano ruota su un lato con un'inclinazione assiale di circa 98 gradi, facendolo sembrare rotolare intorno al Sole."},"options":[{"text":{"en":"Jupiter","fr":"Jupiter","it":"Giove"},"correct":false},{"text":{"en":"Uranus","fr":"Uranus","it":"Urano"},"correct":true},{"text":{"en":"Saturn","fr":"Saturne","it":"Saturno"},"correct":false},{"text":{"en":"Neptune","fr":"Neptune","it":"Nettuno"},"correct":false}]},{"text":{"en":"Which planet is farthest from the Sun?","fr":"Quelle planète est la plus éloignée du Soleil ?","it":"Quale pianeta è il più lontano dal Sole?"},"explanation":{"en":"Neptune is the eighth and farthest planet from the Sun, about 4.5 billion kilometers away.","fr":"Neptune est la huitième planète et la plus éloignée du Soleil, à environ 4,5 milliards de kilomètres.","it":"Nettuno è l'ottavo pianeta e il più lontano dal Sole, a circa 4,5 miliardi di chilometri di distanza."},"options":[{"text":{"en":"Uranus","fr":"Uranus","it":"Urano"},"correct":false},{"text":{"en":"Neptune","fr":"Neptune","it":"Nettuno"},"correct":true},{"text":{"en":"Saturn","fr":"Saturne","it":"Saturno"},"correct":false},{"text":{"en":"Pluto","fr":"Pluton","it":"Plutone"},"correct":false}]},{"text":{"en":"What is the name of Earth's natural satellite?","fr":"Quel est le nom du satellite naturel de la Terre ?","it":"Qual è il nome del satellite naturale della Terra?"},"explanation":{"en":"The Moon is Earth's only natural satellite, orbiting our planet for billions of years.","fr":"La Lune est le seul satellite naturel de la Terre, en orbite autour de notre planète depuis des milliards d'années.","it":"La Luna è l'unico satellite naturale della Terra, in orbita intorno al nostro pianeta da miliardi di anni."},"options":[{"text":{"en":"Phobos","fr":"Phobos","it":"Fobos"},"correct":false},{"text":{"en":"Moon","fr":"Lune","it":"Luna"},"correct":true},{"text":{"en":"Deimos","fr":"Deimos","it":"Deimos"},"correct":false},{"text":{"en":"Io","fr":"Io","it":"Io"},"correct":false}]},{"text":{"en":"Which two planets are between Earth and Jupiter?","fr":"Quelles sont les deux planètes situées entre la Terre et Jupiter ?","it":"Quali due pianeti si trovano tra la Terra e Giove?"},"explanation":{"en":"The planets in order from the iene spesso chiamata il pianeta gemello della Terra perché sono molto simili in dimensioni e massa."},"options":[{"text":{"en":"Venus","fr":"Vénus","it":"Venere"},"correct":true},{"text":{"en":"Mars","fr":"Mars","it":"Marte"},"correct":false},{"text":{"en":"Mercury","fr":"Mercure","it":"Mercurio"},"correct":false},{"text":{"en":"Neptune","fr":"Neptune","it":"Nettuno"},"correct":false}]},{"text":{"en":"How many planets are in our solar system?","fr":"Combien y a-t-il de planètes dans notre système solaire ?","it":"Quanti pianeti ci sono nel nostro sistema solare?"},"explanation":{"en":"There are 8 planets in our solar system: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, and Neptune.","fr":"Il y a 8 planètes dans notre système solaire : Mercure, Vénus, Terre, Mars, Jupiter, Saturne, Uranus et Neptune.","it":"Ci sono 8 pianeti nel nostro sistema solare: Mercurio, Venere, Terra, Marte, Giove, Saturno, Urano e Nettuno."},"options":[{"text":{"en":"8","fr":"8","it":"8"},"correct":true},{"text":{"en":"9","fr":"9","it":"9"},"correct":false},{"text":{"en":"10","fr":"10","it":"10"},"correct":false},{"text":{"en":"7","fr":"7","it":"7"},"correct":false}]},{"text":{"en":"Which planet is known as the Morning Star or Evening Star?","fr":"Quelle planète est appelée l'Étoile du Matin ou l'Étoile du Soir ?","it":"Quale pianeta è chiamato Stella del Mattino o Stella della Sera?"},"explanation":{"en":"Venus appears very bright in the sky and can be seen just before sunrise or just after sunset.","fr":"Vénus paraît très brillante dans le ciel et peut être vue juste avant le lever du soleil ou juste après le coucher du soleil.","it":"Venere appare molto luminosa nel cielo e può essere vista poco prima dell'alba o poco dopo il tramonto."},"options":[{"text":{"en":"Venus","fr":"Vénus","it":"Venere"},"correct":true},{"text":{"en":"Mercury","fr":"Mercure","it":"Mercurio"},"correct":false},{"text":{"en":"Mars","fr":"Mars","it":"Marte"},"correct":false},{"text":{"en":"Jupiter","fr":"Jupiter","it":"Giove"},"correct":false}]},{"text":{"en":"Which gas giant planets have rings?","fr":"Quelles planètes géantes gazeuses possèdent des anneaux ?","it":"Quali pianeti gassosi hanno anelli?"},"explanation":{"en":"All four gas giants (Jupiter, Saturn, Uranus, and Neptune) have ring systems, but Saturn's are the most visible.","fr":"Les quatre géantes gazeuses (Jupiter, Saturne, Uranus et Neptune) possèdent des systèmes d'anneaux, mais ceux de Saturne sont les plus visibles.","it":"Tutti e quattro i giganti gassosi (Giove, Saturno, Urano e Nettuno) hanno sistemi di anelli, ma quelli di Saturno sono i più visibili."},"options":[{"text":{"en":"Jupiter and Saturn only","fr":"Jupiter et Saturne seulement","it":"Solo Giove e Saturno"},"correct":false},{"text":{"en":"All four gas giants","fr":"Les quatre géantes gazeuses","it":"Tutti e quattro i giganti gassosi"},"correct":true},{"text":{"en":"Saturn and Uranus only","fr":"Saturne et Uranus seulement","it":"Solo Saturno e Urano"},"correct":false},{"text":{"en":"Neptune and Uranus only","fr":"Neptune et Uranus seulement","it":"Solo Nettuno e Urano"},"correct":false}]},{"text":{"en":"Which planet has the shortest year?","fr":"Quelle planète a l'année la plus courte ?","it":"Quale pianeta ha l'anno più corto?"},"explanation":{"en":"Mercury orbits the Sun the fastest, completing one orbit in just 88 Earth days.","fr":"Mercure orbite autour du Soleil le plus rapidement, complétant une orbite en seulement 88 jours terrestres.","it":"Mercurio orbita intorno al Sole più velocemente, completando un'orbita in soli 88 giorni terrestri."},"options":[{"text":{"en":"Mercury","fr":"Mercure","it":"Mercurio"},"correct":true},{"text":{"en":"Venus","fr":"Vénus","it":"Venere"},"correct":false},{"text":{"en":"Earth","fr":"Terre","it":"Terra"},"correct":false},{"text":{"en":"Mars","fr":"Mars","it":"Marte"},"correct":false}]},{"text":{"en":"Which planet has the longest day?","fr":"Quelle planète a le jour le plus long ?","it":"Quale pianeta ha il giorno più lungo?"},"explanation":{"en":"Venus rotates very slowly on its axis, taking about 243 Earth days to complete one rotation.","fr":"Vénus tourne très lentement sur son axe, mettant environ 243 jours terrestres pour effectuer une rotation.","it":"Venere ruota molto lentamente sul suo asse, impiegando circa 243 giorni terrestri per completare una rotazione."},"options":[{"text":{"en":"Jupiter","fr":"Jupiter","it":"Giove"},"correct":false},{"text":{"en":"Venus","fr":"Vénus","it":"Venere"},"correct":true},{"text":{"en":"Mercury","fr":"Mercure","it":"Mercurio"},"correct":false},{"text":{"en":"Neptune","fr":"Neptune","it":"Nettuno"},"correct":false}]},{"text":{"en":"Which planet is named after the Roman god of the sea?","fr":"Quelle planète porte le nom du dieu romain de la mer ?","it":"Quale pianeta prende il nome dal dio romano del mare?"},"explanation":{"en":"Neptune was named after the Roman god of the sea because of its deep blue color.","fr":"Neptune a été nommée d'après le dieu romain de la mer en raison de sa couleur bleu profond.","it":"Nettuno è stato chiamato così in onore del dio romano del mare a causa del suo colore blu scuro."},"options":[{"text":{"en":"Uranus","fr":"Uranus","it":"Urano"},"correct":false},{"text":{"en":"Neptune","fr":"Neptune","it":"Nettuno"},"correct":true},{"text":{"en":"Saturn","fr":"Saturne","it":"Saturno"},"correct":false},{"text":{"en":"Jupiter","fr":"Jupiter","it":"Giove"},"correct":false}]},{"text":{"en":"Which planet is the windiest?","fr":"Quelle est la planète la plus venteuse ?","it":"Quale pianeta è il più ventoso?"},"explanation":{"en":"Neptune has the strongest winds in the solar system, reaching speeds of over 2,000 km/h.","fr":"Neptune possède les vents les plus forts du système solaire, atteignant des vitesses supérieures à 2 000 km/h.","it":"Nettuno ha i venti più forti del sistema solare, che raggiungono velocità superiori a 2.000 km/h."},"options":[{"text":{"en":"Jupiter","fr":"Jupiter","it":"Giove"}, <script>/* School-quiz page runtime. Plain classic script, no framework, no build step.
   Rules that keep this safe for kids:
   - quiz and UI text only ever goes in through textContent / text nodes, never innerHTML;
   - image src is set as a property, link hrefs are only built from validated values;
   - styles are only set through the CSSOM (el.style.x), never style="..." attributes (CSP). */
"use strict";

(function () {
  var LANG_KEY = "quizgen-lang";
  var HOME_URL = "https://rcocetta.github.io/school-quiz/";

  // The builder guarantees complete data: every Text has all quiz languages and every
  // language has all UI strings, so there are no fallbacks for missing text below.
  var quiz = JSON.parse(document.getElementById("quiz-data").textContent);
  var uiStrings = JSON.parse(document.getElementById("ui-strings").textContent);
  var app = document.getElementById("app");

  // One object holds everything that has to survive a language switch.
  var state = {
    lang: quiz.languages[0],
    screen: "start",      // "start" | "question" | "end"
    items: [],            // this attempt: [{q, order: [original option indexes]}]
    index: 0,             // current question
    chosen: [],           // per question: original option index, or -1 if unanswered
    revealed: false       // immediate mode: has the current question been answered?
  };

  // Screen readers get feedback messages through this polite live region.
  var live = document.createElement("div");
  live.className = "sr-only";
  live.setAttribute("role", "status");
  live.setAttribute("aria-live", "polite");
  document.body.appendChild(live);

  /* ---------- small helpers ---------- */

  // Create an element. Children can be strings (become text nodes) or nodes.
  function el(tag, className) {
    var node = document.createElement(tag);
    if (className) { node.className = className; }
    for (var i = 2; i < arguments.length; i++) {
      var child = arguments[i];
      if (child === null || child === undefined || child === false) { continue; }
      node.appendChild(typeof child === "string" ? document.createTextNode(child) : child);
    }
    return node;
  }

  // Pick the text for the current language out of a {lang: string} map.
  function tr(map) {
    if (!map) { return ""; }
    return map[state.lang];
  }

  // Built-in UI string for the current language.
  function ui(key, vars) {
    return fill(uiStrings[state.lang][key], vars || {});
  }

  function message(key) {
    return uiStrings[state.lang].messages[key];
  }

  function hasOwn(obj, name) { return Object.prototype.hasOwnProperty.call(obj, name); }

  // Replace {placeholders} in a plain string.
  function fill(template, vars) {
    return template.replace(/\{(\w+)\}/g, function (m, name) {
      return hasOwn(vars, name) ? String(vars[name]) : m;
    });
  }

  // Like fill(), but a value may be a DOM node (used to turn only the name into a link).
  function fillNodes(template, vars) {
    var frag = document.createDocumentFragment();
    template.split(/(\{\w+\})/).forEach(function (part) {
      var m = /^\{(\w+)\}$/.exec(part);
      var value = m && hasOwn(vars, m[1]) ? vars[m[1]] : undefined;
      if (value === undefined) {
        if (part) { frag.appendChild(document.createTextNode(part)); }
      } else {
        frag.appendChild(typeof value === "string" ? document.createTextNode(value) : value);
      }
    });
    return frag;
  }

  function announce(text) {
    live.textContent = "";
    // Clearing first makes screen readers repeat identical messages.
    window.setTimeout(function () { live.textContent = text; }, 30);
  }

  // Fisher-Yates shuffle, returns a new array.
  function shuffled(list) {
    var a = list.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function correctIndex(q) {
    for (var i = 0; i < q.options.length; i++) {
      if (q.options[i].correct) { return i; }
    }
  }

  // 1-based position of an original option index as shown on screen.
  function positionOf(item, optIndex) { return item.order.indexOf(optIndex) + 1; }

  /* ---------- language ---------- */

  function loadSavedLang() {
    try {
      var saved = window.localStorage.getItem(LANG_KEY);
      if (saved && quiz.languages.indexOf(saved) !== -1) { state.lang = saved; }
    } catch (e) { /* storage blocked: the page works without it */ }
  }

  function saveLang() {
    try { window.localStorage.setItem(LANG_KEY, state.lang); } catch (e) { /* ignore */ }
  }

  function applyLangToDocument() {
    document.documentElement.setAttribute("lang", state.lang);
    document.title = tr(quiz.title);
  }

  function setLang(code) {
    if (code === state.lang) { return; }
    state.lang = code;
    saveLang();
    applyLangToDocument();
    render(".lang-btn[data-lang=\"" + code + "\"]");
  }

  function languageSwitcher() {
    if (quiz.languages.length < 2) { return null; }
    var group = el("div", "lang-switch");
    quiz.languages.forEach(function (code) {
      var strings = uiStrings[code];
      var flag = el("span", "flag", strings.flag);
      flag.setAttribute("aria-hidden", "true");
      var btn = el("button", "lang-btn", flag, el("span", "", code.toUpperCase()));
      btn.type = "button";
      btn.setAttribute("data-lang", code);
      btn.setAttribute("lang", code);
      btn.setAttribute("aria-label", strings.name);
      btn.setAttribute("aria-pressed", code === state.lang ? "true" : "false");
      btn.addEventListener("click", function () { setLang(code); });
      group.appendChild(btn);
    });
    var nav = el("nav", "topbar", group);
    nav.setAttribute("aria-label", ui("choose_language"));
    return nav;
  }

  /* ---------- shared pieces ---------- */

  function safeUrl(url) {
    return typeof url === "string" && /^https?:\/\//i.test(url) ? url : null;
  }

  function safeEmail(email) {
    return typeof email === "string" && /^[^\s<>?&#:]+@[^\s<>?&#:]+$/.test(email) ? email : null;
  }

  function externalLink(href, text) {
    var a = el("a", "", text);
    a.href = href;
    a.rel = "noopener noreferrer";
    // New tab so a child following a link does not lose the quiz in progress.
    if (/^https?:/i.test(href)) { a.target = "_blank"; }
    return a;
  }

  function authorLine() {
    var author = quiz.author;
    if (!author || !author.name) { return null; }
    var url = safeUrl(author.url);
    var email = safeEmail(author.email);
    var nameNode = author.name;
    if (url) { nameNode = externalLink(url, author.name); }
    else if (email) { nameNode = externalLink("mailto:" + email, author.name); }
    var p = el("p", "meta");
    p.appendChild(fillNodes(ui("made_by"), { name: nameNode }));
    return p;
  }

  // Site mode only: a link back to the index page (builder sets index_url, a relative path).
  function backLink() {
    var url = quiz.index_url;
    if (typeof url !== "string" || !url || url.indexOf(":") !== -1 || url.indexOf("//") === 0) { return null; }
    var a = el("a", "back-link", el("span", "back-arrow", "\u2190"), ui("back_to_all"));
    a.firstChild.setAttribute("aria-hidden", "true");
    a.href = url;
    return a;
  }

  function footer() {
    return el("footer", "footer", externalLink(HOME_URL, ui("made_with")));
  }

  // Accessible text for an option's image (see the contract's fallback rules).
  function optionAlt(opt, position) {
    if (opt.image_alt !== undefined && opt.image_alt !== null) { return tr(opt.image_alt); }   // "" = decorative
    if (opt.text) { return ""; }              // the text next to it already says it
    return ui("picture_n", { n: position });
  }

  function makeImage(className, src, alt) {
    var img = el("img", className);
    img.alt = alt;
    img.src = src;
    return img;
  }

  // Short inline version of an option, for the feedback panel and the review list.
  function inlineAnswer(opt, position) {
    var span = el("span", "inline-answer");
    if (opt.image) { span.appendChild(makeImage("review-img", opt.image, optionAlt(opt, position))); }
    if (opt.text) { span.appendChild(document.createTextNode(tr(opt.text))); }
    return span;
  }

  /* ---------- quiz flow ---------- */

  function startAttempt() {
    var pool = shuffled(quiz.questions);
    var count = Math.min(quiz.questions_per_quiz, pool.length);
    state.items = pool.slice(0, count).map(function (q) {
      var order = q.options.map(function (o, i) { return i; });
      return { q: q, correct: correctIndex(q), order: quiz.shuffle_options ? shuffled(order) : order };
    });
    state.chosen = state.items.map(function () { return -1; });
    state.index = 0;
    state.revealed = false;
    state.screen = "question";
    render(".js-heading");
  }

  // A tap or key press only selects (and can be changed); "Check" or "Next" confirms.
  function pick(optionIndex) {
    if (quiz.feedback === "immediate" && state.revealed) { return; }
    state.chosen[state.index] = optionIndex;
    render(".option[data-i=\"" + optionIndex + "\"]");
  }

  function check() {
    if (state.chosen[state.index] === -1 || state.revealed) { return; }
    state.revealed = true;
    render(".js-feedback");
  }

  function plainAnswer(opt, position) {
    return opt.text ? tr(opt.text) : optionAlt(opt, position);
  }

  function next() {
    if (state.chosen[state.index] === -1) { return; }
    if (state.index + 1 < state.items.length) {
      state.index += 1;
      state.revealed = false;
      render(".js-heading");
    } else {
      state.screen = "end";
      render(".js-heading");
    }
  }

  /* ---------- screens ---------- */

  function startScreen() {
    var n = Math.min(quiz.questions_per_quiz, quiz.questions.length);
    var heading = el("h1", "js-heading", tr(quiz.title));
    heading.tabIndex = -1;
    var startBtn = el("button", "btn", ui("start"));
    startBtn.type = "button";
    startBtn.addEventListener("click", startAttempt);
    var desc = quiz.description ? el("p", "lead", tr(quiz.description)) : null;
    var hero = el("section", "hero", heading, desc,
      el("p", "badge-count", ui(n === 1 ? "questions_count_one" : "questions_count", { count: n })), authorLine(), startBtn);
    return el("main", "screen", backLink(), hero);
  }

  function optionButton(item, pos) {
    var optIndex = item.order[pos];
    var opt = item.q.options[optIndex];
    var locked = quiz.feedback === "immediate" && state.revealed;
    var chosen = state.chosen[state.index];
    var isChosen = chosen === optIndex;

    var btn = el("button", "option");
    btn.type = "button";
    btn.setAttribute("data-i", String(optIndex));

    var key = el("span", "option-key", String(pos + 1));
    key.setAttribute("aria-hidden", "true");
    var body = el("span", "option-body");
    if (opt.image) { body.appendChild(makeImage("option-img", opt.image, optionAlt(opt, pos + 1))); }
    if (opt.text) { body.appendChild(el("span", "", tr(opt.text))); }
    var mark = el("span", "mark");
    mark.setAttribute("aria-hidden", "true");
    btn.appendChild(key);
    btn.appendChild(body);
    btn.appendChild(mark);

    if (locked) {
      // Icon + text for sighted users; extra words for screen readers on each button.
      btn.setAttribute("aria-disabled", "true");
      if (opt.correct) {
        btn.setAttribute("data-state", isChosen ? "right" : "reveal");
        mark.textContent = "✓";
        btn.appendChild(el("span", "sr-only", " (" + ui("correct_answer") + ")"));
      } else if (isChosen) {
        btn.setAttribute("data-state", "wrong");
        mark.textContent = "✗";
      }
      if (isChosen) { btn.appendChild(el("span", "sr-only", " (" + ui("your_answer") + ")")); }
    } else if (isChosen) {
      btn.setAttribute("data-state", "selected");
      btn.setAttribute("aria-pressed", "true");
      mark.textContent = "●";
    } else {
      btn.setAttribute("aria-pressed", "false");
    }
    if (!locked) { btn.addEventListener("click", function () { pick(optIndex); }); }
    return btn;
  }

  function feedbackPanel(item) {
    var chosen = state.chosen[state.index];
    var ok = item.q.options[chosen].correct === true;
    var icon = el("span", "feedback-icon", ok ? "✓" : "✗");
    icon.setAttribute("aria-hidden", "true");
    var body = el("div", "feedback-body", el("p", "feedback-title", ok ? ui("correct") : ui("wrong")));
    if (!ok) {
      body.appendChild(el("p", "answer-line", ui("the_answer_was") + " ",
        inlineAnswer(item.q.options[item.correct], positionOf(item, item.correct))));
    }
    if (item.q.explanation) { body.appendChild(el("p", "", tr(item.q.explanation))); }
    var panel = el("div", ok ? "feedback js-feedback" : "feedback feedback--oops js-feedback", icon, body);
    panel.tabIndex = -1;
    return panel;
  }

  function questionScreen() {
    var item = state.items[state.index];
    var total = state.items.length;
    var current = state.index + 1;

    var barFill = el("div", "progress-fill");
    barFill.style.width = Math.round((current / total) * 100) + "%";   // CSSOM: allowed by the CSP
    var bar = el("div", "progress", barFill);
    bar.setAttribute("aria-hidden", "true");
    var progress = el("p", "progress-text", ui("question_x_of_y", { current: current, total: total }));

    progress.id = "progress-text";
    var heading = el("h2", "js-heading", tr(item.q.text));
    heading.tabIndex = -1;
    heading.setAttribute("aria-describedby", "progress-text");
    var image = item.q.image ? makeImage("question-img", item.q.image, tr(item.q.image_alt)) : null;

    var allPictures = item.q.options.every(function (o) { return o.image && !o.text; });
    var list = el("div", allPictures ? "options options--pictures" : "options");
    for (var pos = 0; pos < item.order.length; pos++) { list.appendChild(optionButton(item, pos)); }

    // Hidden h1 so every page has one top heading; the question itself is the h2.
    var screen = el("main", "screen", el("h1", "sr-only", tr(quiz.title)), progress, bar, heading, image, list);

    var answered = state.chosen[state.index] !== -1;
    if (quiz.feedback === "immediate" && state.revealed) { screen.appendChild(feedbackPanel(item)); }
    var confirm = null;
    if (quiz.feedback === "immediate" && !state.revealed) {
      confirm = el("button", "btn js-check", ui("check"));
      confirm.addEventListener("click", check);
    } else {
      var last = state.index + 1 === total;
      confirm = el("button", "btn js-next", last ? ui("finish") : ui("next"));
      confirm.addEventListener("click", next);
    }
    confirm.type = "button";
    confirm.disabled = !answered;
    screen.appendChild(confirm);
    var back = backLink();
    if (back) { screen.appendChild(back); }  // none in single-file mode
    return screen;
  }

  function reviewItem(item, i) {
    var chosenIdx = state.chosen[i];
    var q = item.q;
    var ci = item.correct;
    var ok = chosenIdx === ci;
    var mark = el("span", "mark", ok ? "✓" : "✗");
    mark.setAttribute("aria-hidden", "true");

    var body = el("div", "review-body",
      el("p", "review-q", el("span", "sr-only", (ok ? ui("correct") : ui("wrong")) + " "), tr(q.text)));
    var mine = chosenIdx === -1 ? null : inlineAnswer(q.options[chosenIdx], positionOf(item, chosenIdx));
    body.appendChild(el("p", "review-line", el("strong", "", ui("your_answer") + ": "), mine));
    if (!ok) {
      body.appendChild(el("p", "review-line", el("strong", "", ui("correct_answer") + ": "),
        inlineAnswer(q.options[ci], positionOf(item, ci))));
    }
    if (q.explanation) { body.appendChild(el("p", "review-explain", tr(q.explanation))); }

    var li = el("li", "review-item", mark, body);
    li.setAttribute("data-ok", ok ? "true" : "false");
    return li;
  }

  function endScreen() {
    var total = state.items.length;
    var score = 0;
    state.items.forEach(function (item, i) {
      if (state.chosen[i] === item.correct) { score += 1; }
    });
    var pct = total ? score / total : 0;
    var tier = pct >= 0.8 ? "great" : pct >= 0.5 ? "good" : "keep_trying";

    var heading = el("h1", "score-label js-heading", ui("your_score"));
    heading.tabIndex = -1;
    var again = el("button", "btn", ui("try_again"));
    again.type = "button";
    again.addEventListener("click", startAttempt);
    var value = el("p", "score-value", ui("score_x_of_y", { score: score, total: total }));
    var note = el("p", "score-message", message(tier));
    value.id = "score-value";
    note.id = "score-message";
    heading.setAttribute("aria-describedby", "score-value score-message");   // heard on arrival
    var result = el("section", "result", heading, value, note, again);

    var list = el("ol", "review-list");
    state.items.forEach(function (item, i) { list.appendChild(reviewItem(item, i)); });
    return el("main", "screen", backLink(), result, el("h2", "review-title", ui("review")), list);
  }

  /* ---------- render ---------- */

  // Rebuild the whole page from state, then move focus to `focusSelector`.
  // Rebuilding is cheap and keeps the code simple: state is the only truth.
  function render(focusSelector) {
    var screen = state.screen === "question" ? questionScreen()
      : state.screen === "end" ? endScreen() : startScreen();
    var page = el("div", "page", languageSwitcher(), screen, footer());
    app.textContent = "";
    app.appendChild(page);
    var target = focusSelector && app.querySelector(focusSelector);
    if (target) { target.focus(); }
    if (focusSelector === ".js-heading") { window.scrollTo(0, 0); }
  }

  /* ---------- keyboard: number keys pick options ---------- */

  // Number keys only select, and only while focus is inside the options (WCAG 2.1.4).
  document.addEventListener("keydown", function (event) {
    if (state.screen !== "question" || event.ctrlKey || event.metaKey || event.altKey || event.shiftKey) { return; }
    if (!(event.target && event.target.closest && event.target.closest(".options"))) { return; }
    var n = parseInt(event.key, 10);
    var item = state.items[state.index];
    if (!(n >= 1 && n <= 9) || n > item.order.length) { return; }
    if (quiz.feedback === "immediate" && state.revealed) { return; }
    event.preventDefault();
    pick(item.order[n - 1]);
  });

  loadSavedLang();
  applyLangToDocument();
  render("");
})();
</script>
</body>
</html>

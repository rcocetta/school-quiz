[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quizgen"
version = "0.1.0"
description = "Turn simple quiz JSON files into static, offline-friendly HTML quizzes for kids."
readme = "README.md"
keywords = ["quiz", "education", "school", "kids", "static-site", "html", "json"]
authors = [{ name = "school-quiz contributors" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Education",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Education",
  "Topic :: Text Processing :: Markup :: HTML",
]
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = ["jsonschema>=4.0", "jinja2>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]
browser = ["playwright>=1.56"]

[project.urls]
Homepage = "https://github.com/rcocetta/school-quiz"
Repository = "https://github.com/rcocetta/school-quiz"
Issues = "https://github.com/rcocetta/school-quiz/issues"
Changelog = "https://github.com/rcocetta/school-quiz/blob/main/CHANGELOG.md"

[project.scripts]
quizgen = "quizgen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quizgen = [
  "schema.json",
  "collection.schema.json",
  "site.schema.json",
  "ui_strings.json",
  "templates/*",
  "static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

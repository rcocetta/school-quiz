[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quizgen"
version = "0.1.0"
description = "Turn simple quiz JSON files into static HTML quizzes for kids."
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = ["jsonschema>=4.0", "jinja2>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/rcocetta/school-quiz"
Repository = "https://github.com/rcocetta/school-quiz"

[project.scripts]
quizgen = "quizgen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quizgen = [
  "schema.json",
  "collection.schema.json",
  "site.schema.json",
  "ui_strings.json",
  "templates/*",
  "static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

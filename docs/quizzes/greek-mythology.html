<script type="application/json" id="quiz-data">{"title":{"en":"Greek Mythology","fr":"La mythologie grecque"},"description":{"en":"Gods, heroes and monsters of ancient Greece. Each game picks 10 of the 80 questions.","fr":"Dieux, héros et monstres de la Grèce antique. Chaque partie tire au sort 10 des 80 questions."},"languages":["en","fr"],"questions_per_quiz":10,"feedback":"immediate","shuffle_options":true,"author":{"name":"school-quiz","url":"https://github.com/rcocetta/school-quiz"},"questions":[{"text":{"en":"Who was the king of the gods on Mount Olympus?","fr":"Qui était le roi des dieux sur le mont Olympe ?"},"explanation":{"en":"Zeus ruled the sky and hurled thunderbolts when he was angry.","fr":"Zeus régnait sur le ciel et lançait la foudre quand il était en colère."},"options":[{"text":{"en":"Zeus","fr":"Zeus"},"correct":true},{"text":{"en":"Poseidon","fr":"Poséidon"},"correct":false},{"text":{"en":"Hades","fr":"Hadès"},"correct":false},{"text":{"en":"Apollo","fr":"Apollon"},"correct":false}]},{"text":{"en":"Who was the queen of the gods and the wife of Zeus?","fr":"Qui était la reine des dieux et l'épouse de Zeus ?"},"explanation":{"en":"Hera protected marriage and families. She was often jealous of Zeus's children.","fr":"Héra protégeait le mariage et les familles. Elle était souvent jalouse des enfants de Zeus."},"options":[{"text":{"en":"Athena","fr":"Athéna"},"correct":false},{"text":{"en":"Hera","fr":"Héra"},"correct":true},{"text":{"en":"Demeter","fr":"Déméter"},"correct":false},{"text":{"en":"Artemis","fr":"Artémis"},"correct":false}]},{"text":{"en":"Which god ruled the sea and was said to make the earth shake?","fr":"Quel dieu régnait sur la mer et faisait, disait-on, trembler la terre ?"},"explanation":{"en":"Poseidon was the god of the sea. The Greeks thought he caused earthquakes, and his symbol was the trident.","fr":"Poséidon était le dieu de la mer. Les Grecs pensaient qu'il provoquait les tremblements de terre ; son symbole était le trident."},"options":[{"text":{"en":"Hermes","fr":"Hermès"},"correct":false},{"text":{"en":"Ares","fr":"Arès"},"correct":false},{"text":{"en":"Poseidon","fr":"Poséidon"},"correct":true},{"text":{"en":"Dionysus","fr":"Dionysos"},"correct":false}]},{"text":{"en":"Which goddess was born from Zeus's head, fully grown and wearing armour?","fr":"Quelle déesse est née de la tête de Zeus, déjà adulte et en armure ?"},"explanation":{"en":"Athena was the goddess of wisdom and clever strategy. The city of Athens is named after her.","fr":"Athéna était la déesse de la sagesse et de la stratégie. La ville d'Athènes porte son nom."},"options":[{"text":{"en":"Artemis","fr":"Artémis"},"correct":false},{"text":{"en":"Aphrodite","fr":"Aphrodite"},"correct":false},{"text":{"en":"Hera","fr":"Héra"},"correct":false},{"text":{"en":"Athena","fr":"Athéna"},"correct":true}]},{"text":{"en":"Which goddess of love and beauty was said to be born from sea foam?","fr":"Quelle déesse de l'amour et de la beauté serait née de l'écume de la mer ?"},"explanation":{"en":"Aphrodite rose from the foam of the sea near the island of Cyprus.","fr":"Aphrodite serait sortie de l'écume de la mer, près de l'île de Chypre."},"options":[{"text":{"en":"Aphrodite","fr":"Aphrodite"},"correct":true},{"text":{"en":"Hestia","fr":"Hestia"},"correct":false},{"text":{"en":"Demeter","fr":"Déméter"},"correct":false},{"text":{"en":"Persephone","fr":"Perséphone"},"correct":false}]},{"text":{"en":"Which god was the messenger of the gods, with winged sandals?","fr":"Quel dieu était le messager des dieux, chaussé de sandales ailées ?"},"explanation":{"en":"Hermes also guided travellers and the souls of the dead.","fr":"Hermès guidait aussi les voyageurs et les âmes des morts."},"options":[{"text":{"en":"Apollo","fr":"Apollon"},"correct":false},{"text":{"en":"Hermes","fr":"Hermès"},"correct":true},{"text":{"en":"Ares","fr":"Arès"},"correct":false},{"text":{"en":"Hephaestus","fr":"Héphaïstos"},"correct":false}]},{"text":{"en":"Who was the god of war and battle?","fr":"Qui était le dieu de la guerre et des combats ?"},"explanation":{"en":"Ares loved fighting itself. Athena was also a warrior, but she was known for wisdom and clever plans.","fr":"Arès aimait les combats pour eux-mêmes. Athéna était aussi une guerrière, mais elle était connue pour sa sagesse et ses plans astucieux."},"options":[{"text":{"en":"Hephaestus","fr":"Héphaïstos"},"correct":false},{"text":{"en":"Poseidon","fr":"Poséidon"},"correct":false},{"text":{"en":"Ares","fr":"Arès"},"correct":true},{"text":{"en":"Dionysus","fr":"Dionysos"},"correct":false}]},{"text":{"en":"Which god was the blacksmith of Olympus, working with fire and metal?","fr":"Quel dieu était le forgeron de l'Olympe, qui travaillait le feu et le métal ?"},"explanation":{"en":"Hephaestus was the god of fire and metalworking. He built the golden palaces of the gods.","fr":"Héphaïstos était le dieu du feu et de la métallurgie. Il construisit les palais dorés des dieux."},"options":[{"text":{"en":"Hermes","fr":"Hermès"},"correct":false},{"text":{"en":"Apollo","fr":"Apollon"},"correct":false},{"text":{"en":"Cronus","fr":"Cronos"},"correct":false},{"text":{"en":"Hephaestus","fr":"Héphaïstos"},"correct":true}]},{"text":{"en":"Which goddess of hunting and wild animals was the twin sister of Apollo?","fr":"Quelle déesse de la chasse et des animaux sauvages était la jumelle d'Apollon ?"},"explanation":{"en":"Artemis is often shown with a bow and arrows. She protected wild animals and young girls.","fr":"Artémis est souvent représentée avec un arc et des flèches. Elle protégeait les animaux sauvages et les jeunes filles."},"options":[{"text":{"en":"Artemis","fr":"Artémis"},"correct":true},{"text":{"en":"Athena","fr":"Athéna"},"correct":false},{"text":{"en":"Aphrodite","fr":"Aphrodite"},"correct":false},{"text":{"en":"Demeter","fr":"Déméter"},"correct":false}]},{"text":{"en":"Which god was the god of wine, festivals and theatre?","fr":"Quel dieu était celui du vin, des fêtes et du théâtre ?"},"explanation":{"en":"Dionysus was also called Bacchus by the Romans. Greeks held theatre contests in his honour.","fr":"Dionysos était aussi appelé Bacchus par les Romains. Les Grecs organisaient des concours de théâtre en son honneur."},"options":[{"text":{"en":"Hades","fr":"Hadès"},"correct":false},{"text":{"en":"Dionysus","fr":"Dionysos"},"correct":true},{"text":{"en":"Hermes","fr":"Hermès"},"correct":false},{"text":{"en":"Hephaestus","fr":"Héphaïstos"},"correct":false}]},{"text":{"en":"Which goddess looked after the harvest and grain?","fr":"Quelle déesse veillait sur les récoltes et les céréales ?"},"explanation":{"en":"Demeter taught people how to grow grain.","fr":"Déméter apprit aux hommes à cultiver les céréales."},"options":[{"text":{"en":"Hestia","fr":"Hestia"},"correct":false},{"text":{"en":"Artemis","fr":"Artémis"},"correct":false},{"text":{"en":"Demeter","fr":"Déméter"},"correct":true},{"text":{"en":"Iris","fr":"Iris"},"correct":false}]},{"text":{"en":"Which goddess watched over the hearth, the fire at the heart of the home?","fr":"Quelle déesse veillait sur le foyer, le feu au cœur de la maison ?"},"explanation":{"en":"Hestia was the goddess of the home and the family fire.","fr":"Hestia était la déesse du foyer et du feu familial."},"options":[{"text":{"en":"Hera","fr":"Héra"},"correct":false},{"text":{"en":"Persephone","fr":"Perséphone"},"correct":false},{"text":{"en":"Nemesis","fr":"Némésis"},"correct":false},{"text":{"en":"Hestia","fr":"Hestia"},"correct":true}]},{"text":{"en":"Which goddess became queen of the underworld, and spent part of each year there?","fr":"Quelle déesse devint reine des Enfers et y passait une partie de chaque année ?"},"explanation":{"en":"Hades carried Persephone to the underworld. The Greeks said her yearly return to Earth brought spring.","fr":"Hadès emporta Perséphone aux Enfers. Selon les Grecs, son retour chaque année sur Terre apportait le printemps."},"options":[{"text":{"en":"Persephone","fr":"Perséphone"},"correct":true},{"text":{"en":"Demeter","fr":"Déméter"},"correct":false},{"text":{"en":"Hera","fr":"Héra"},"correct":false},{"text":{"en":"Aphrodite","fr":"Aphrodite"},"correct":false}]},{"text":{"en":"Which god ruled the underworld, the land where the dead went?","fr":"Quel dieu régnait sur le monde souterrain où allaient les morts ?"},"explanation":{"en":"Hades ruled the land of the dead, below the Earth. He did not live on Mount Olympus.","fr":"Hadès régnait sur le royaume des morts, sous la Terre. Il ne vivait pas sur l'Olympe."},"options":[{"text":{"en":"Zeus","fr":"Zeus"},"correct":false},{"text":{"en":"Hades","fr":"Hadès"},"correct":true},{"text":{"en":"Poseidon","fr":"Poséidon"},"correct":false},{"text":{"en":"Hermes","fr":"Hermès"},"correct":false}]},{"text":{"en":"Who was the god of love and desire, often shown as a winged child with a bow and arrows?","fr":"Quel dieu de l'amour et du désir, souvent représenté en enfant ailé avec un arc et des flèches ?"},"explanation":{"en":"In later stories Eros is often called the son of Aphrodite. The Romans called him Cupid.","fr":"Dans les récits plus tardifs, Éros est souvent appelé le fils d'Aphrodite. Les Romains l'appelaient Cupidon."},"options":[{"text":{"en":"Pan","fr":"Pan"},"correct":false},{"text":{"en":"Ares","fr":"Arès"},"correct":false},{"text":{"en":"Eros","fr":"Éros"},"correct":true},{"text":{"en":"Hermes","fr":"Hermès"},"correct":false}]},{"text":{"en":"How many Muses were there, the goddesses who inspired art, music and learning?","fr":"Combien y avait-il de Muses, les déesses qui inspiraient les arts, la musique et le savoir ?"},"explanation":{"en":"The nine Muses each inspired a different art, such as poetry, dance, history or astronomy.","fr":"Les neuf Muses inspiraient chacune un art différent, comme la poésie, la danse, l'histoire ou l'astronomie."},"options":[{"text":{"en":"3","fr":"3"},"correct":false},{"text":{"en":"7","fr":"7"},"correct":false},{"text":{"en":"12","fr":"12"},"correct":false},{"text":{"en":"9","fr":"9"},"correct":true}]},{"text":{"en":"Which musical instrument was the favourite of Apollo, the god of music?","fr":"Quel instrument de musique était le préféré d'Apollon, dieu de la musique ?"},"explanation":{"en":"Apollo played the lyre, a small instrument with strings, like a little harp.","fr":"Apollon jouait de la lyre, un petit instrument à cordes semblable à une petite harpe."},"options":[{"text":{"en":"Lyre","fr":"Lyre"},"correct":true},{"text":{"en":"Flute","fr":"Flûte"},"correct":false},{"text":{"en":"Drum","fr":"Tambour"},"correct":false},{"text":{"en":"Trumpet","fr":"Trompette"},"correct":false}]},{"text":{"en":"Which goddess was linked to the rainbow, and carried messages between the gods and humans?","fr":"Quelle déesse, liée à l'arc-en-ciel, servait de messagère entre les dieux et les hommes ?"},"explanation":{"en":"Iris travelled along the rainbow to carry the gods' messages.","fr":"Iris voyageait le long de l'arc-en-ciel pour porter les messages des dieux."},"options":[{"text":{"en":"Eos","fr":"Éos"},"correct":false},{"text":{"en":"Iris","fr":"Iris"},"correct":true},{"text":{"en":"Selene","fr":"Séléné"},"correct":false},{"text":{"en":"Nyx","fr":"Nyx"},"correct":false}]},{"text":{"en":"Which god brought sleep to people?","fr":"Quel dieu apportait le sommeil aux hommes ?"},"explanation":{"en":"Hypnos brought sleep. His brother Thanatos brought death.","fr":"Hypnos apportait le sommeil. Son frère Thanatos apportait la mort."},"options":[{"text":{"en":"Thanatos","fr":"Thanatos"},"correct":false},{"text":{"en":"Morpheus","fr":"Morphée"},"correct":false},{"text":{"en":"Hypnos","fr":"Hypnos"},"correct":true},{"text":{"en":"Hermes","fr":"Hermès"},"correct":false}]},{"text":{"en":"The god Pan had the legs and horns of which animal?","fr":"Le dieu Pan avait les jambes et les cornes de quel animal ?"},"explanation":{"en":"Pan was the god of shepherds and wild places. He played a pipe made of reeds.","fr":"Pan était le dieu des bergers et des lieux sauvages. Il jouait d'une flûte faite de roseaux."},"options":[{"text":{"en":"A horse","fr":"Un cheval"},"correct":false},{"text":{"en":"A bull","fr":"Un taureau"},"correct":false},{"text":{"en":"A lion","fr":"Un lion"},"correct":false},{"text":{"en":"A goat","fr":"Une chèvre"},"correct":true}]},{"text":{"en":"According to the poet Hesiod, what empty void came first, before the world existed?","fr":"Selon le poète Hésiode, quel vide originel est apparu en premier, avant l'existence du monde ?"},"explanation":{"en":"In Hesiod's story, Chaos came first. Then came Gaia, the Earth.","fr":"Dans le récit d'Hésiode, Chaos est apparu en premier, puis Gaïa, la Terre."},"options":[{"text":{"en":"Chaos","fr":"Chaos"},"correct":true},{"text":{"en":"Olympus","fr":"Olympe"},"correct":false},{"text":{"en":"The Styx","fr":"Le Styx"},"correct":false},{"text":{"en":"The Cyclopes","fr":"Les Cyclopes"},"correct":false}]},{"text":{"en":"Which goddess personified the Earth and gave birth to the sky, the sea and the mountains?","fr":"Quelle déesse personnifiait la Terre et donna naissance au ciel, à la mer et aux montagnes ?"},"explanation":{"en":"Gaia gave birth to the sky, the sea and the mountains. Her children included the Titans.","fr":"Gaïa donna naissance au ciel, à la mer et aux montagnes. Parmi ses enfants se trouvaient les Titans."},"options":[{"text":{"en":"Nyx","fr":"Nyx"},"correct":false},{"text":{"en":"Gaia","fr":"Gaïa"},"correct":true},{"text":{"en":"Hera","fr":"Héra"},"correct":false},{"text":{"en":"Eos","fr":"Éos"},"correct":false}]},{"text":{"en":"Which Titan ruled the world before Zeus, and swallowed his own children?","fr":"Quel Titan régna avant Zeus et avala ses propres enfants ?"},"explanation":{"en":"Cronus feared that one of his children would overthrow him. Zeus did it, and freed his brothers and sisters.","fr":"Cronos craignait qu'un de ses enfants le renverse. Zeus y parvint et libéra ses frères et sœurs."},"options":[{"text":{"en":"Atlas","fr":"Atlas"},"correct":false},{"text":{"en":"Prometheus","fr":"Prométhée"},"correct":false},{"text":{"en":"Cronus","fr":"Cronos"},"correct":true},{"text":{"en":"Helios","fr":"Hélios"},"correct":false}]},{"text":{"en":"Which goddess tricked Cronus to save her baby, Zeus?","fr":"Quelle déesse trompa Cronos pour sauver son bébé, Zeus ?"},"explanation":{"en":"Rhea gave Cronus a stone wrapped in cloth instead of Zeus. Zeus grew up in a cave on Crete.","fr":"Rhéa donna à Cronos une pierre enveloppée de langes à la place de Zeus. Zeus grandit dans une grotte en Crète."},"options":[{"text":{"en":"Gaia","fr":"Gaïa"},"correct":false},{"text":{"en":"Hera","fr":"Héra"},"correct":false},{"text":{"en":"Demeter","fr":"Déméter"},"correct":false},{"text":{"en":"Rhea","fr":"Rhéa"},"correct":true}]},{"text":{"en":"Which Titan was condemned to hold up the sky forever?","fr":"Quel Titan fut condamné à porter le ciel pour l'éternité ?"},"explanation":{"en":"Atlas held up the sky. People often think he held up the Earth, but that is a mistake.","fr":"Atlas portait le ciel sur ses épaules. Beaucoup croient à tort qu'il portait la Terre."},"options":[{"text":{"en":"Atlas","fr":"Atlas"},"correct":true},{"text":{"en":"Prometheus","fr":"Prométhée"},"correct":false},{"text":{"en":"Helios","fr":"Hélios"},"correct":false},{"text":{"en":"Cronus","fr":"Cronos"},"correct":false}]},{"text":{"en":"Which Titan gave fire to humans and was punished by being chained to a rock?","fr":"Quel Titan donna le feu aux hommes et fut puni en étant enchaîné à un rocher ?"},"explanation":{"en":"Prometheus stole fire from the gods. Zeus chained him to a rock, and an eagle came every day to eat his liver.","fr":"Prométhée déroba le feu aux dieux. Zeus l'enchaîna à un rocher, et un aigle venait chaque jour lui manger le foie."},"options":[{"text":{"en":"Atlas","fr":"Atlas"},"correct":false},{"text":{"en":"Prometheus","fr":"Prométhée"},"correct":true},{"text":{"en":"Helios","fr":"Hélios"},"correct":false},{"text":{"en":"Pan","fr":"Pan"},"correct":false}]},{"text":{"en":"Which Titan drove the sun across the sky in a golden chariot?","fr":"Quel Titan conduisait le soleil dans le ciel sur un char d'or ?"},"explanation":{"en":"Helios drove his chariot from dawn to dusk, every day.","fr":"Hélios conduisait son char de l'aube au crépuscule, chaque jour."},"options":[{"text":{"en":"Eos","fr":"Éos"},"correct":false},{"text":{"en":"Selene","fr":"Séléné"},"correct":false},{"text":{"en":"Helios","fr":"Hélios"},"correct":true},{"text":{"en":"Nyx","fr":"Nyx"},"correct":false}]},{"text":{"en":"Which goddess personified the night?","fr":"Quelle déesse personnifiait la nuit ?"},"explanation":{"en":"Nyx was the goddess of the night. In Hesiod she is the mother of Aether and Day.","fr":"Nyx était la déesse de la nuit. Chez Hésiode, elle est la mère d'Éther et de Héméra, le jour."},"options":[{"text":{"en":"Eos","fr":"Éos"},"correct":false},{"text":{"en":"Selene","fr":"Séléné"},"correct":false},{"text":{"en":"Hestia","fr":"Hestia"},"correct":false},{"text":{"en":"Nyx","fr":"Nyx"},"correct":true}]},{"text":{"en":"Which Titan goddess personified memory?","fr":"Quelle déesse titane personnifiait la mémoire ?"},"explanation":{"en":"Mnemosyne's name means memory. Zeus was the father of her daughters, the Muses.","fr":"Mnémosyne signifie « mémoire ». Zeus fut le père de ses filles, les Muses."},"options":[{"text":{"en":"Mnemosyne","fr":"Mnémosyne"},"correct":true},{"text":{"en":"Rhea","fr":"Rhéa"},"correct":false},{"text":{"en":"Gaia","fr":"Gaïa"},"correct":false},{"text":{"en":"Themis","fr":"Thémis"},"correct":false}]},{"text":{"en":"Which goddess of divine law and order is shown holding a pair of scales?","fr":"Quelle déesse de la loi divine et de l'ordre est représentée tenant une balance ?"},"explanation":{"en":"Themis stood for fair rules and justice. Her scales show that everyone should be judged fairly.","fr":"Thémis représentait les règles justes et la justice. Sa balance montre que chacun doit être jugé avec équité."},"options":[{"text":{"en":"Nemesis","fr":"Némésis"},"correct":false},{"text":{"en":"Themis","fr":"Thémis"},"correct":true},{"text":{"en":"Iris","fr":"Iris"},"correct":false},{"text":{"en":"Nyx","fr":"Nyx"},"correct":false}]},{"text":{"en":"Which hero, son of Zeus, was famous for completing twelve labours?","fr":"Quel héros, fils de Zeus, est célèbre pour ses douze travaux ?"},"explanation":{"en":"Heracles, called Hercules by the Romans, completed twelve labours set by King Eurystheus.","fr":"Héraclès, appelé Hercule par les Romains, accomplit douze travaux imposés par le roi Eurysthée."},"options":[{"text":{"en":"Perseus","fr":"Persée"},"correct":false},{"text":{"en":"Theseus","fr":"Thésée"},"correct":false},{"text":{"en":"Heracles","fr":"Héraclès"},"correct":true},{"text":{"en":"Jason","fr":"Jason"},"correct":false}]},{"text":{"en":"Which Athenian hero escaped a maze with the help of Ariadne's thread?","fr":"Quel héros athénien sortit d'un labyrinthe grâce au fil d'Ariane ?"},"explanation":{"en":"After killing the Minotaur, Theseus used Ariadne's thread to find the way out of the maze.","fr":"Après avoir tué le Minotaure, Thésée suivit le fil d'Ariane pour retrouver la sortie du labyrinthe."},"options":[{"text":{"en":"Perseus","fr":"Persée"},"correct":false},{"text":{"en":"Heracles","fr":"Héraclès"},"correct":false},{"text":{"en":"Odysseus","fr":"Ulysse"},"correct":false},{"text":{"en":"Theseus","fr":"Thésée"},"correct":true}]},{"text":{"en":"Which hero led a crew of heroes on the ship Argo to find the Golden Fleece?","fr":"Quel héros conduisit l'équipage de héros du navire Argo à la recherche de la Toison d'or ?"},"explanation":{"en":"Jason sailed on the Argo with the Argonauts to bring back the Golden Fleece.","fr":"Jason navigua sur l'Argo avec les Argonautes pour rapporter la Toison d'or."},"options":[{"text":{"en":"Jason","fr":"Jason"},"correct":true},{"text":{"en":"Perseus","fr":"Persée"},"correct":false},{"text":{"en":"Bellerophon","fr":"Bellérophon"},"correct":false},{"text":{"en":"Achilles","fr":"Achille"},"correct":false}]},{"text":{"en":"Which hero used a polished shield as a mirror to avoid a deadly stare?","fr":"Quel héros utilisa un bouclier poli comme miroir pour éviter un regard mortel ?"},"explanation":{"en":"Perseus looked at the monster only in his shield, so her gaze could not turn him to stone.","fr":"Persée ne regarda le monstre que dans son bouclier poli, pour que son regard ne le change pas en pierre."},"options":[{"text":{"en":"Heracles","fr":"Héraclès"},"correct":false},{"text":{"en":"Perseus","fr":"Persée"},"correct":true},{"text":{"en":"Theseus","fr":"Thésée"},"correct":false},{"text":{"en":"Jason","fr":"Jason"},"correct":false}]},{"text":{"en":"Which great Greek warrior was invulnerable everywhere except his heel?","fr":"Quel grand guerrier grec était invulnérable partout sauf au talon ?"},"explanation":{"en":"His mother held him by the heel when she dipped him in the river Styx, so that spot was not protected.","fr":"Sa mère le tenait par le talon en le plongeant dans le Styx : cette partie de son corps n'était pas protégée."},"options":[{"text":{"en":"Hector","fr":"Hector"},"correct":false},{"text":{"en":"Paris","fr":"Pâris"},"correct":false},{"text":{"en":"Achilles","fr":"Achille"},"correct":true},{"text":{"en":"Odysseus","fr":"Ulysse"},"correct":false}]},{"text":{"en":"Which wise centaur taught many young heroes in Greek myth?","fr":"Quel centaure sage enseigna à de nombreux jeunes héros dans la mythologie grecque ?"},"explanation":{"en":"Most centaurs were wild, but Chiron was wise and gentle. He had a horse's body and a man's upper body.","fr":"La plupart des centaures étaient sauvages, mais Chiron était sage et doux. Il avait un corps de cheval et le torse d'un homme."},"options":[{"text":{"en":"Pegasus","fr":"Pégase"},"correct":false},{"text":{"en":"Cerberus","fr":"Cerbère"},"correct":false},{"text":{"en":"Minotaur","fr":"Minotaure"},"correct":false},{"text":{"en":"Chiron","fr":"Chiron"},"correct":true}]},{"text":{"en":"Which musician went to the underworld to bring back his wife, Eurydice?","fr":"Quel musicien descendit aux Enfers pour ramener sa femme, Eurydice ?"},"explanation":{"en":"Orpheus charmed Hades with his music, but he looked back before they left the underworld, and lost Eurydice for ever.","fr":"Orphée charma Hadès par sa musique, mais il se retourna avant de quitter les Enfers et perdit Eurydice pour toujours."},"options":[{"text":{"en":"Orpheus","fr":"Orphée"},"correct":true},{"text":{"en":"Narcissus","fr":"Narcisse"},"correct":false},{"text":{"en":"Jason","fr":"Jason"},"correct":false},{"text":{"en":"Midas","fr":"Midas"},"correct":false}]},{"text":{"en":"Which hero tamed a winged horse with a golden bridle given by Athena?","fr":"Quel héros dompta un cheval ailé grâce à une bride d'or offerte par Athéna ?"},"explanation":{"en":"Bellerophon caught the winged horse with the golden bridle, then rode him to fight the Chimera.","fr":"Bellérophon attrapa le cheval ailé avec la bride d'or, puis le chevaucha pour combattre la Chimère."},"options":[{"text":{"en":"Perseus","fr":"Persée"},"correct":false},{"text":{"en":"Bellerophon","fr":"Bellérophon"},"correct":true},{"text":{"en":"Heracles","fr":"Héraclès"},"correct":false},{"text":{"en":"Theseus","fr":"Thésée"},"correct":false}]},{"text":{"en":"Which huntress was a fast runner who married only the man who could beat her in a race?","fr":"Quelle chasseresse, très rapide à la course, n'épousait que celui qui la battrait à la course ?"},"explanation":{"en":"Atalanta raced her suitors. Hippomenes won by dropping golden apples, which made her stop to pick them up.","fr":"Atalante défiait ses prétendants à la course. Hippomène gagna en laissant tomber des pommes d'or, qu'elle s'arrêta pour ramasser."},"options":[{"text":{"en":"Artemis","fr":"Artémis"},"correct":false},{"text":{"en":"Arachne","fr":"Arachné"},"correct":false},{"text":{"en":"Atalanta","fr":"Atalante"},"correct":true},{"text":{"en":"Andromeda","fr":"Andromède"},"correct":false}]},{"text":{"en":"As a baby, which hero strangled two snakes in his cradle?","fr":"Quand il était bébé, quel héros étrangla deux serpents dans son berceau ?"},"explanation":{"en":"Hera sent two snakes to kill the baby, but he strangled them with his bare hands.","fr":"Héra envoya deux serpents pour tuer le bébé, mais il les étrangla de ses propres mains."},"options":[{"text":{"en":"Jason","fr":"Jason"},"correct":false},{"text":{"en":"Perseus","fr":"Persée"},"correct":false},{"text":{"en":"Theseus","fr":"Thésée"},"correct":false},{"text":{"en":"Heracles","fr":"Héraclès"},"correct":true}]},{"text":{"en":"Which one-eyed giant was blinded by a cunning hero who called himself 'Nobody'?","fr":"Quel géant borgne fut aveuglé par un héros rusé qui se fit appeler « Personne » ?"},"explanation":{"en":"The hero told the giant his name was 'Nobody'. Then he blinded the giant and escaped by hiding under sheep.","fr":"Le héros dit au géant qu'il s'appelait « Personne ». Il aveugla le géant, puis s'échappa caché sous des moutons."},"options":[{"text":{"en":"Polyphemus","fr":"Polyphème"},"correct":true},{"text":{"en":"Argus","fr":"Argos"},"correct":false},{"text":{"en":"Cerberus","fr":"Cerbère"},"correct":false},{"text":{"en":"Typhon","fr":"Typhon"},"correct":false}]},{"text":{"en":"Which monster had snakes for hair and turned anyone who looked at her into stone?","fr":"Quel monstre avait des serpents à la place des cheveux et changeait en pierre quiconque la regardait ?"},"explanation":{"en":"Medusa was one of the three Gorgons. Her gaze turned anyone who looked at her into stone.","fr":"Méduse était l'une des trois Gorgones. Son regard changeait en pierre quiconque la regardait."},"options":[{"text":{"en":"Sphinx","fr":"Sphinx"},"correct":false},{"text":{"en":"Medusa","fr":"Méduse"},"correct":true},{"text":{"en":"Harpy","fr":"Harpie"},"correct":false},{"text":{"en":"Siren","fr":"Sirène"},"correct":false}]},{"text":{"en":"Which monster, half man and half bull, was kept hidden in a labyrinth?","fr":"Quel monstre, moitié homme et moitié taureau, était enfermé dans un labyrinthe ?"},"explanation":{"en":"The Minotaur was the son of Queen Pasiphae and a white bull. King Minos kept him hidden in the labyrinth.","fr":"Le Minotaure était le fils de la reine Pasiphaé et d'un taureau blanc. Le roi Minos l'enferma dans le labyrinthe."},"options":[{"text":{"en":"Cyclops","fr":"Cyclope"},"correct":false},{"text":{"en":"Centaur","fr":"Centaure"},"correct":false},{"text":{"en":"Minotaur","fr":"Minotaure"},"correct":true},{"text":{"en":"Chimera","fr":"Chimère"},"correct":false}]},{"text":{"en":"Which monster had three heads and guarded the gates of the underworld?","fr":"Quel monstre à trois têtes gardait les portes des Enfers ?"},"explanation":{"en":"Cerberus stopped the dead from leaving the underworld. Heracles captured him as his twelfth labour.","fr":"Cerbère empêchait les morts de quitter les Enfers. Héraclès le capture lors de son douzième travail."},"options":[{"text":{"en":"Hydra","fr":"Hydre"},"correct":false},{"text":{"en":"Chimera","fr":"Chimère"},"correct":false},{"text":{"en":"Sphinx","fr":"Sphinx"},"correct":false},{"text":{"en":"Cerberus","fr":"Cerbère"},"correct":true}]},{"text":{"en":"Which many-headed monster grew two new heads for every head that was cut off?","fr":"Quel monstre à plusieurs têtes en voyait repousser deux pour chaque tête coupée ?"},"explanation":{"en":"Heracles defeated the Hydra with help from his nephew, who burned each neck after it was cut.","fr":"Héraclès vainquit l'Hydre avec l'aide de son neveu Iolaos, qui brûlait chaque cou après qu'on l'avait coupé."},"options":[{"text":{"en":"Hydra","fr":"Hydre"},"correct":true},{"text":{"en":"Chimera","fr":"Chimère"},"correct":false},{"text":{"en":"Typhon","fr":"Typhon"},"correct":false},{"text":{"en":"Griffin","fr":"Griffon"},"correct":false}]},{"text":{"en":"Which fire-breathing monster had a lion's head, a goat's body and a snake's tail?","fr":"Quel monstre crachant du feu avait une tête de lion, un corps de chèvre et une queue de serpent ?"},"explanation":{"en":"The Chimera was killed by Bellerophon, who rode the winged horse Pegasus.","fr":"La Chimère fut tuée par Bellérophon, monté sur le cheval ailé Pégase."},"options":[{"text":{"en":"Hydra","fr":"Hydre"},"correct":false},{"text":{"en":"Chimera","fr":"Chimère"},"correct":true},{"text":{"en":"Minotaur","fr":"Minotaure"},"correct":false},{"text":{"en":"Harpy","fr":"Harpie"},"correct":false}]},{"text":{"en":"Which monster had a lion's body and a woman's head, and asked travellers a riddle?","fr":"Quel monstre avait un corps de lion et une tête de femme, et posait une énigme aux voyageurs ?"},"explanation":{"en":"The Sphinx asked: what walks on four legs in the morning, two at noon and three in the evening? The answer is a human.","fr":"Le Sphinx demandait : quel être marche à quatre pattes le matin, à deux pattes à midi et à trois pattes le soir ? La réponse : l'être humain."},"options":[{"text":{"en":"Griffin","fr":"Griffon"},"correct":false},{"text":{"en":"Harpy","fr":"Harpie"},"correct":false},{"text":{"en":"Sphinx","fr":"Sphinx"},"correct":true},{"text":{"en":"Centaur","fr":"Centaure"},"correct":false}]},{"text":{"en":"Which singing creatures lured sailors onto the rocks with their song?","fr":"Quelles créatures, par leur chant, attiraient les marins sur les rochers ?"},"explanation":{"en":"Odysseus had his crew fill their ears with wax and tie him to the mast, so he could hear the song safely.","fr":"Ulysse fit boucher les oreilles de ses marins avec de la cire et se fit attacher au mât pour entendre le chant sans danger."},"options":[{"text":{"en":"Harpies","fr":"Harpies"},"correct":false},{"text":{"en":"Nymphs","fr":"Nymphes"},"correct":false},{"text":{"en":"Gorgons","fr":"Gorgones"},"correct":false},{"text":{"en":"Sirens","fr":"Sirènes"},"correct":true}]},{"text":{"en":"Which giant monster had a hundred snake heads and tried to take the heavens from the gods?","fr":"Quel monstre géant aux cent têtes de serpent voulut s'emparer du ciel aux dépens des dieux ?"},"explanation":{"en":"Typhon was one of the most dangerous monsters. Zeus defeated him and imprisoned him in Tartarus; later poets placed him under Mount Etna.","fr":"Typhon était l'un des monstres les plus dangereux. Zeus le vainquit et l'enferma au Tartare ; des poètes plus tardifs le placèrent sous l'Etna."},"options":[{"text":{"en":"Typhon","fr":"Typhon"},"correct":true},{"text":{"en":"Atlas","fr":"Atlas"},"correct":false},{"text":{"en":"Argus","fr":"Argos"},"correct":false},{"text":{"en":"Cerberus","fr":"Cerbère"},"correct":false}]},{"text":{"en":"Which winged horse carried the thunderbolts of Zeus?","fr":"Quel cheval ailé portait la foudre de Zeus ?"},"explanation":{"en":"Pegasus was born from the blood of Medusa when Perseus cut off her head.","fr":"Pégase est né du sang de Méduse lorsque Persée lui trancha la tête."},"options":[{"text":{"en":"Centaur","fr":"Centaure"},"correct":false},{"text":{"en":"Pegasus","fr":"Pégase"},"correct":true},{"text":{"en":"Chimera","fr":"Chimère"},"correct":false},{"text":{"en":"Unicorn","fr":"Licorne"},"correct":false}]},{"text":{"en":"Which Trojan prince took Helen away from her husband, starting the Trojan War?","fr":"Quel prince troyen enleva Hélène à son époux, ce qui déclencha la guerre de Troie ?"},"explanation":{"en":"Paris, son of King Priam, took Helen from Menelaus, the king of Sparta.","fr":"Pâris, fils du roi Priam, emmena Hélène loin de Ménélas, roi de Sparte."},"options":[{"text":{"en":"Hector","fr":"Hector"},"correct":false},{"text":{"en":"Aeneas","fr":"Énée"},"correct":false},{"text":{"en":"Paris","fr":"Pâris"},"correct":true},{"text":{"en":"Priam","fr":"Priam"},"correct":false}]},{"text":{"en":"Who was the bravest defender of Troy, son of King Priam, who died in battle?","fr":"Quel fut le plus vaillant défenseur de Troie, fils du roi Priam, mort au combat ?"},"explanation":{"en":"Hector led the Trojan army. Achilles killed him in battle to avenge his friend Patroclus.","fr":"Hector commandait l'armée troyenne. Achille le tua au combat pour venger son ami Patrocle."},"options":[{"text":{"en":"Paris","fr":"Pâris"},"correct":false},{"text":{"en":"Aeneas","fr":"Énée"},"correct":false},{"text":{"en":"Odysseus","fr":"Ulysse"},"correct":false},{"text":{"en":"Hector","fr":"Hector"},"correct":true}]},{"text":{"en":"What wooden object did the Greeks leave outside Troy, with soldiers hidden inside it?","fr":"Quel objet en bois les Grecs laissèrent-ils devant Troie, avec des soldats cachés à l'intérieur ?"},"explanation":{"en":"The Greeks pretended to sail away and left a giant wooden horse. Soldiers hidden inside opened the gates at night.","fr":"Les Grecs firent semblant de partir et laissèrent un immense cheval de bois. Des soldats cachés à l'intérieur ouvrirent les portes la nuit."},"options":[{"text":{"en":"A giant wooden horse","fr":"Un immense cheval de bois"},"correct":true},{"text":{"en":"A battering ram","fr":"Un bélier"},"correct":false},{"text":{"en":"A siege tower","fr":"Une tour de siège"},"correct":false},{"text":{"en":"A wooden bridge","fr":"Un pont en bois"},"correct":false}]},{"text":{"en":"Which hero was king of Ithaca, known for his cleverness and his long journey home?","fr":"Quel héros était roi d'Ithaque, connu pour son intelligence et son long voyage de retour ?"},"explanation":{"en":"Odysseus took ten years to get home after the Trojan War. His adventures are told in the Odyssey.","fr":"Ulysse mit dix ans pour rentrer chez lui après la guerre de Troie. Ses aventures sont racontées dans l'Odyssée."},"options":[{"text":{"en":"Menelaus","fr":"Ménélas"},"correct":false},{"text":{"en":"Odysseus","fr":"Ulysse"},"correct":true},{"text":{"en":"Agamemnon","fr":"Agamemnon"},"correct":false},{"text":{"en":"Achilles","fr":"Achille"},"correct":false}]},{"text":{"en":"What is the name of the epic poem, attributed to Homer, that tells the story of Odysseus's journey home?","fr":"Quel est le nom du long poème épique attribué à Homère, qui raconte le retour d'Ulysse ?"},"explanation":{"en":"The Iliad tells the story of the Trojan War itself. The Odyssey tells the journey home.","fr":"L'Iliade raconte la guerre de Troie elle-même ; l'Odyssée raconte le voyage de retour."},"options":[{"text":{"en":"The Iliad","fr":"L'Iliade"},"correct":false},{"text":{"en":"The Aeneid","fr":"L'Énéide"},"correct":false},{"text":{"en":"The Odyssey","fr":"L'Odyssée"},"correct":true},{"text":{"en":"The Argonautica","fr":"Les Argonautiques"},"correct":false}]},{"text":{"en":"Which goddess threw a golden apple marked 'For the Fairest' at a wedding, starting a quarrel among the goddesses?","fr":"Quelle déesse jeta une pomme d'or « À la plus belle » lors d'un mariage, déclenchant une querelle entre les déesses ?"},"explanation":{"en":"Eris, goddess of discord, was not invited to a wedding. She threw the apple to start a quarrel between Hera, Athena and Aphrodite.","fr":"Éris, déesse de la discorde, ne fut pas invitée à un mariage. Elle jeta la pomme pour semer la dispute entre Héra, Athéna et Aphrodite."},"options":[{"text":{"en":"Nemesis","fr":"Némésis"},"correct":false},{"text":{"en":"Hecate","fr":"Hécate"},"correct":false},{"text":{"en":"Iris","fr":"Iris"},"correct":false},{"text":{"en":"Eris","fr":"Éris"},"correct":true}]},{"text":{"en":"Who was Odysseus's wife, who kept the suitors waiting by unpicking her weaving every night?","fr":"Qui était l'épouse d'Ulysse, qui retarda les prétendants en défaisant chaque nuit son ouvrage ?"},"explanation":{"en":"Penelope wove a shroud by day and unpicked it at night, to put off the suitors who wanted to marry her.","fr":"Pénélope tissait un linceul le jour et le défaisait la nuit, pour retarder les prétendants qui voulaient l'épouser."},"options":[{"text":{"en":"Penelope","fr":"Pénélope"},"correct":true},{"text":{"en":"Helen","fr":"Hélène"},"correct":false},{"text":{"en":"Andromache","fr":"Andromaque"},"correct":false},{"text":{"en":"Arachne","fr":"Arachné"},"correct":false}]},{"text":{"en":"Which goddess protected Odysseus and helped him on his journey home?","fr":"Quelle déesse protégea Ulysse et l'aida pendant son voyage de retour ?"},"explanation":{"en":"Athena was on Odysseus's side. She helped him stay brave and find his way home.","fr":"Athéna était du côté d'Ulysse. Elle l'aida à rester courageux et à retrouver le chemin de sa maison."},"options":[{"text":{"en":"Hera","fr":"Héra"},"correct":false},{"text":{"en":"Athena","fr":"Athéna"},"correct":true},{"text":{"en":"Aphrodite","fr":"Aphrodite"},"correct":false},{"text":{"en":"Demeter","fr":"Déméter"},"correct":false}]},{"text":{"en":"Which nymph kept Odysseus on her island for seven years?","fr":"Quelle nymphe garda Ulysse sur son île pendant sept ans ?"},"explanation":{"en":"Calypso offered Odysseus immortality, but he wanted to go home to his wife, Penelope.","fr":"Calypso offrit l'immortalité à Ulysse, mais il voulait rentrer chez lui auprès de sa femme, Pénélope."},"options":[{"text":{"en":"Circe","fr":"Circé"},"correct":false},{"text":{"en":"Nausicaa","fr":"Nausicaa"},"correct":false},{"text":{"en":"Calypso","fr":"Calypso"},"correct":true},{"text":{"en":"Thetis","fr":"Thétis"},"correct":false}]},{"text":{"en":"Which enchantress turned some of Odysseus's sailors into pigs?","fr":"Quelle magicienne transforma certains marins d'Ulysse en cochons ?"},"explanation":{"en":"Circe used a potion. Hermes gave Odysseus a magic herb, called moly, to protect him.","fr":"Circé utilisa un philtre. Hermès donna à Ulysse une plante magique, le moly, pour le protéger."},"options":[{"text":{"en":"Calypso","fr":"Calypso"},"correct":false},{"text":{"en":"Medea","fr":"Médée"},"correct":false},{"text":{"en":"Sirens","fr":"Sirènes"},"correct":false},{"text":{"en":"Circe","fr":"Circé"},"correct":true}]},{"text":{"en":"On which mountain did the Greek gods live?","fr":"Sur quelle montagne vivaient les dieux grecs ?"},"explanation":{"en":"Mount Olympus, the highest mountain in Greece, was the home of the gods. The gods were said to live on its peak.","fr":"Le mont Olympe, la plus haute montagne de Grèce, était la demeure des dieux. On disait qu'ils vivaient sur son sommet."},"options":[{"text":{"en":"Mount Olympus","fr":"Le mont Olympe"},"correct":true},{"text":{"en":"Mount Etna","fr":"Le mont Etna"},"correct":false},{"text":{"en":"Mount Everest","fr":"L'Everest"},"correct":false},{"text":{"en":"Mount Vesuvius","fr":"Le Vésuve"},"correct":false}]},{"text":{"en":"In which city was the famous oracle of Apollo, where a priestess gave prophecies?","fr":"Dans quelle ville se trouvait le célèbre oracle d'Apollon, où une prêtresse donnait des prophéties ?"},"explanation":{"en":"The priestess Pythia gave Apollo's answers at his temple in Delphi.","fr":"La prêtresse Pythie rendait les oracles d'Apollon dans son temple de Delphes."},"options":[{"text":{"en":"Sparta","fr":"Sparte"},"correct":false},{"text":{"en":"Delphi","fr":"Delphes"},"correct":true},{"text":{"en":"Corinth","fr":"Corinthe"},"correct":false},{"text":{"en":"Mycenae","fr":"Mycènes"},"correct":false}]},{"text":{"en":"Which city bears the name of Athena, after she won a contest against Poseidon?","fr":"Quelle ville porte le nom d'Athéna, après qu'elle eut remporté un concours contre Poséidon ?"},"explanation":{"en":"Athena and Poseidon both wanted to protect the city. The judges chose Athena's olive tree as the better gift.","fr":"Athéna et Poséidon voulaient tous deux protéger la ville. Les juges choisirent l'olivier d'Athéna comme le meilleur don."},"options":[{"text":{"en":"Sparta","fr":"Sparte"},"correct":false},{"text":{"en":"Thebes","fr":"Thèbes"},"correct":false},{"text":{"en":"Athens","fr":"Athènes"},"correct":true},{"text":{"en":"Corinth","fr":"Corinthe"},"correct":false}]},{"text":{"en":"Which island was the home of King Minos and his palace at Knossos?","fr":"Quelle île était le royaume du roi Minos, avec son palais de Cnossos ?"},"explanation":{"en":"In the legend, King Minos ruled Crete from his palace at Knossos, where the Labyrinth was said to be.","fr":"Dans la légende, le roi Minos régnait sur la Crète depuis son palais de Cnossos, où se trouvait le labyrinthe."},"options":[{"text":{"en":"Cyprus","fr":"Chypre"},"correct":false},{"text":{"en":"Rhodes","fr":"Rhodes"},"correct":false},{"text":{"en":"Corfu","fr":"Corfou"},"correct":false},{"text":{"en":"Crete","fr":"Crète"},"correct":true}]},{"text":{"en":"Who ferried the souls of the dead across the river to the underworld, for a coin?","fr":"Qui faisait traverser aux âmes des morts le fleuve des Enfers, contre une pièce ?"},"explanation":{"en":"The Greeks placed a coin in the mouth of the dead to pay Charon, the ferryman.","fr":"Les Grecs plaçaient une pièce dans la bouche des morts pour payer Charon, le passeur."},"options":[{"text":{"en":"Charon","fr":"Charon"},"correct":true},{"text":{"en":"Thanatos","fr":"Thanatos"},"correct":false},{"text":{"en":"Hades","fr":"Hadès"},"correct":false},{"text":{"en":"Cerberus","fr":"Cerbère"},"correct":false}]},{"text":{"en":"Which river did the gods swear their most serious oaths on?","fr":"Sur quel fleuve les dieux prêtaient-ils leurs serments les plus solennels ?"},"explanation":{"en":"A god who broke an oath sworn on the Styx was punished severely.","fr":"Un dieu qui brisait un serment prêté sur le Styx était sévèrement puni."},"options":[{"text":{"en":"Nile","fr":"Nil"},"correct":false},{"text":{"en":"Styx","fr":"Styx"},"correct":true},{"text":{"en":"Tiber","fr":"Tibre"},"correct":false},{"text":{"en":"Danube","fr":"Danube"},"correct":false}]},{"text":{"en":"Who designed the Labyrinth for King Minos?","fr":"Qui conçut le labyrinthe pour le roi Minos ?"},"explanation":{"en":"Daedalus, the inventor, later escaped from Crete with wings made of feathers and wax.","fr":"Dédale, l'inventeur, s'échappa plus tard de Crète avec des ailes faites de plumes et de cire."},"options":[{"text":{"en":"Theseus","fr":"Thésée"},"correct":false},{"text":{"en":"Hephaestus","fr":"Héphaïstos"},"correct":false},{"text":{"en":"Daedalus","fr":"Dédale"},"correct":true},{"text":{"en":"Perseus","fr":"Persée"},"correct":false}]},{"text":{"en":"Why did Icarus fall into the sea?","fr":"Pourquoi Icare est-il tombé dans la mer ?"},"explanation":{"en":"Icarus flew too close to the sun, and the sun's heat melted the wax holding his feathers on.","fr":"Icare vola trop près du soleil, et la chaleur fit fondre la cire qui retenait ses plumes."},"options":[{"text":{"en":"A storm blew him off course","fr":"Une tempête l'a fait dévier de sa route"},"correct":false},{"text":{"en":"An archer shot him down","fr":"Un archer l'a abattu d'une flèche"},"correct":false},{"text":{"en":"His wings were too heavy","fr":"Ses ailes étaient trop lourdes"},"correct":false},{"text":{"en":"He flew too close to the sun, and the wax on his wings melted","fr":"Il vola trop près du soleil, et la cire de ses ailes a fondu"},"correct":true}]},{"text":{"en":"Which wise king became a judge of the dead in the underworld, after his life on Earth?","fr":"Quel roi sage devint juge des morts aux Enfers, après sa vie sur Terre ?"},"explanation":{"en":"King Minos was a wise and just ruler on Earth. In the underworld he judged the dead.","fr":"Le roi Minos fut un souverain sage et juste sur Terre. Aux Enfers, il jugeait les morts."},"options":[{"text":{"en":"Minos","fr":"Minos"},"correct":true},{"text":{"en":"Theseus","fr":"Thésée"},"correct":false},{"text":{"en":"Odysseus","fr":"Ulysse"},"correct":false},{"text":{"en":"Perseus","fr":"Persée"},"correct":false}]},{"text":{"en":"Where, in Greek myth, did heroes and good people go after death?","fr":"Où, dans la mythologie grecque, allaient les héros et les bonnes personnes après la mort ?"},"explanation":{"en":"The Elysian Fields were a peaceful paradise. Wicked souls were sent to Tartarus instead.","fr":"Les Champs-Élysées de l'Antiquité étaient un paradis paisible. Les âmes mauvaises étaient envoyées au Tartare."},"options":[{"text":{"en":"Tartarus","fr":"Le Tartare"},"correct":false},{"text":{"en":"The Elysian Fields","fr":"Les Champs-Élysées"},"correct":true},{"text":{"en":"Mount Olympus","fr":"Le mont Olympe"},"correct":false},{"text":{"en":"Delphi","fr":"Delphes"},"correct":false}]},{"text":{"en":"Which famous sports competition began in ancient Greece, at Olympia, in honour of Zeus?","fr":"Quelle grande compétition sportive est née en Grèce antique, à Olympie, en l'honneur de Zeus ?"},"explanation":{"en":"The first Olympic Games we have a written record of took place in 776 BC. The winners were crowned with olive leaves.","fr":"Les premiers Jeux olympiques dont nous avons une trace écrite ont eu lieu en 776 av. J.-C. Les vainqueurs recevaient une couronne d'olivier."},"options":[{"text":{"en":"The World Cup","fr":"La Coupe du monde"},"correct":false},{"text":{"en":"The Tour de France","fr":"Le Tour de France"},"correct":false},{"text":{"en":"The Olympic Games","fr":"Les Jeux olympiques"},"correct":true},{"text":{"en":"Wimbledon","fr":"Wimbledon"},"correct":false}]},{"text":{"en":"Which god is said to have given his name to the word 'panic'?","fr":"Quel dieu aurait donné son nom au mot « panique » ?"},"explanation":{"en":"Ancient Greeks linked the word 'panic' to Pan, whose sudden shouts were thought to frighten people.","fr":"Les Grecs reliaient le mot « panique » à Pan, dont les cris soudains étaient censés effrayer les gens."},"options":[{"text":{"en":"Hermes","fr":"Hermès"},"correct":false},{"text":{"en":"Ares","fr":"Arès"},"correct":false},{"text":{"en":"Hades","fr":"Hadès"},"correct":false},{"text":{"en":"Pan","fr":"Pan"},"correct":true}]},{"text":{"en":"Which mortal weaver was turned into a spider after a contest with a goddess?","fr":"Quelle mortelle tisseuse fut transformée en araignée après un concours contre une déesse ?"},"explanation":{"en":"Arachne challenged the goddess Athena to a weaving contest. The scientific name for spiders, arachnids, comes from her name.","fr":"Arachné défia la déesse Athéna dans un concours de tissage. Le nom scientifique des araignées, les arachnides, vient de son nom."},"options":[{"text":{"en":"Arachne","fr":"Arachné"},"correct":true},{"text":{"en":"Penelope","fr":"Pénélope"},"correct":false},{"text":{"en":"Ariadne","fr":"Ariane"},"correct":false},{"text":{"en":"Medusa","fr":"Méduse"},"correct":false}]},{"text":{"en":"Which planet is named after the Roman god who was the equivalent of Poseidon?","fr":"Quelle planète porte le nom du dieu romain équivalent de Poséidon ?"},"explanation":{"en":"Neptune was the Roman god of the sea. The Romans identified him with the Greek god Poseidon.","fr":"Neptune était le dieu romain de la mer. Les Romains l'identifiaient au dieu grec Poséidon."},"options":[{"text":{"en":"Jupiter","fr":"Jupiter"},"correct":false},{"text":{"en":"Neptune","fr":"Neptune"},"correct":true},{"text":{"en":"Saturn","fr":"Saturne"},"correct":false},{"text":{"en":"Mercury","fr":"Mercure"},"correct":false}]},{"text":{"en":"Which young man fell in love with his own reflection in a pool of water?","fr":"Quel jeune homme tomba amoureux de son propre reflet dans l'eau d'un bassin ?"},"explanation":{"en":"Narcissus stared at his reflection until he wasted away. The narcissus flower is named after him.","fr":"Narcisse resta à contempler son reflet jusqu'à dépérir. La fleur du narcisse porte son nom."},"options":[{"text":{"en":"Midas","fr":"Midas"},"correct":false},{"text":{"en":"Echo","fr":"Écho"},"correct":false},{"text":{"en":"Narcissus","fr":"Narcisse"},"correct":true},{"text":{"en":"Orpheus","fr":"Orphée"},"correct":false}]},{"text":{"en":"Which king was granted the power to turn everything he touched into gold?","fr":"Quel roi reçut le pouvoir de transformer en or tout ce qu'il touchait ?"},"explanation":{"en":"King Midas received the gift from Dionysus, but his food turned to gold too, so he asked to lose the power.","fr":"Le roi Midas reçut ce don de Dionysos, mais sa nourriture se changea aussi en or ; il demanda alors à perdre ce pouvoir."},"options":[{"text":{"en":"Minos","fr":"Minos"},"correct":false},{"text":{"en":"Cronus","fr":"Cronos"},"correct":false},{"text":{"en":"Aeolus","fr":"Éole"},"correct":false},{"text":{"en":"Midas","fr":"Midas"},"correct":true}]},{"text":{"en":"Which goddess personified the dawn?","fr":"Quelle déesse personnifiait l'aube ?"},"explanation":{"en":"Eos was the goddess of the dawn. Her name is the Greek word for dawn.","fr":"Éos était la déesse de l'aube. Son nom signifie « aurore » en grec."},"options":[{"text":{"en":"Eos","fr":"Éos"},"correct":true},{"text":{"en":"Nyx","fr":"Nyx"},"correct":false},{"text":{"en":"Selene","fr":"Séléné"},"correct":false},{"text":{"en":"Iris","fr":"Iris"},"correct":false}]},{"text":{"en":"Which hunter, placed among the stars, forms one of the most famous constellations in the night sky?","fr":"Quel chasseur, placé parmi les étoiles, forme l'une des constellations les plus célèbres du ciel nocturne ?"},"explanation":{"en":"Orion was a giant hunter in Greek myth. You can still find his shape in the winter sky.","fr":"Orion était un chasseur géant dans la mythologie grecque. On retrouve encore sa silhouette dans le ciel d'hiver."},"options":[{"text":{"en":"Cassiopeia","fr":"Cassiopée"},"correct":false},{"text":{"en":"Orion","fr":"Orion"},"correct":true},{"text":{"en":"Andromeda","fr":"Andromède"},"correct":false},{"text":{"en":"Draco","fr":"Le Dragon"},"correct":false}]},{"text":{"en":"What does a 'Herculean task' mean?","fr":"Que signifie une « tâche herculéenne » ?"},"explanation":{"en":"The word comes from Hercules, the Roman name of the hero Heracles, who was famous for his great strength.","fr":"Le mot vient d'Hercule, nom romain du héros Héraclès, célèbre pour sa force immense."},"options":[{"text":{"en":"Very short and easy","fr":"Très court et facile"},"correct":false},{"text":{"en":"Very boring","fr":"Très ennuyeux"},"correct":false},{"text":{"en":"Very difficult, and needing great strength","fr":"Très difficile, et demandant une force immense"},"correct":true},{"text":{"en":"Very colourful","fr":"Très coloré"},"correct":false}]},{"text":{"en":"Which nymph was cursed to repeat only the last words that others said?","fr":"Quelle nymphe fut condamnée à ne répéter que les derniers mots prononcés par les autres ?"},"explanation":{"en":"Hera cursed the nymph Echo, who could then only repeat the ends of other people's sentences.","fr":"Héra jeta un sort à la nymphe Écho, qui ne pouvait plus que répéter la fin des phrases des autres."},"options":[{"text":{"en":"Calypso","fr":"Calypso"},"correct":false},{"text":{"en":"Iris","fr":"Iris"},"correct":false},{"text":{"en":"Thetis","fr":"Thétis"},"correct":false},{"text":{"en":"Echo","fr":"Écho"},"correct":true}]}],"index_url":"index.html"}</script>

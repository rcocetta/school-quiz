<script type="application/json" id="quiz-data">{"title":{"en":"Egyptian Mythology","fr":"La mythologie égyptienne","it":"La mitologia egizia"},"description":{"en":"Gods, goddesses and legends of ancient Egypt.","fr":"Dieux, déesses et légendes de l'Égypte ancienne.","it":"Dèi, dee e leggende dell'antico Egitto."},"languages":["en","fr","it"],"questions_per_quiz":8,"feedback":"immediate","shuffle_options":true,"author":{"name":"school-quiz","url":"https://github.com/rcocetta/school-quiz"},"questions":[{"text":{"en":"Who was the sun god, one of the most important gods of ancient Egypt?","fr":"Qui était le dieu du soleil, l'un des dieux les plus importants de l'Égypte ancienne ?","it":"Chi era il dio del Sole, uno dei più importanti dell'antico Egitto?"},"explanation":{"en":"Ra was the sun god. The Egyptians believed he made the sun rise every morning.","fr":"Rê était le dieu du soleil. Les Égyptiens croyaient qu'il faisait lever le soleil chaque matin.","it":"Ra era il dio del Sole. Gli Egizi credevano che facesse sorgere il sole ogni mattina."},"options":[{"text":{"en":"Ra","fr":"Rê","it":"Ra"},"correct":true},{"text":{"en":"Anubis","fr":"Anubis","it":"Anubi"},"correct":false},{"text":{"en":"Bastet","fr":"Bastet","it":"Bastet"},"correct":false},{"text":{"en":"Geb","fr":"Geb","it":"Geb"},"correct":false}]},{"text":{"en":"Which god had the head of a jackal and looked after mummies?","fr":"Quel dieu avait une tête de chacal et veillait sur les momies ?","it":"Quale dio aveva la testa di sciacallo e si prendeva cura delle mummie?"},"explanation":{"en":"Anubis, the jackal god, watched over mummies and guided the dead on their journey.","fr":"Anubis, le dieu à tête de chacal, veillait sur les momies et guidait les morts pendant leur voyage.","it":"Anubi, il dio con la testa di sciacallo, vegliava sulle mummie e guidava i defunti nel loro viaggio."},"options":[{"text":{"en":"Anubis","fr":"Anubis","it":"Anubi"},"correct":true},{"text":{"en":"Horus","fr":"Horus","it":"Horus"},"correct":false},{"text":{"en":"Sobek","fr":"Sobek","it":"Sobek"},"correct":false},{"text":{"en":"Thoth","fr":"Thot","it":"Toth"},"correct":false}]},{"text":{"en":"Which god had the head of a falcon?","fr":"Quel dieu avait une tête de faucon ?","it":"Quale dio aveva la testa di falco?"},"explanation":{"en":"Horus was the falcon-headed god of the sky. His eye, the Eye of Horus, was a lucky charm that protected people.","fr":"Horus était le dieu du ciel à tête de faucon. Son œil, l'œil d'Horus, était un porte-bonheur qui protégeait les gens.","it":"Horus era il dio del cielo con la testa di falco. Il suo occhio, l'Occhio di Horus, era un portafortuna che proteggeva le persone."},"options":[{"text":{"en":"Horus","fr":"Horus","it":"Horus"},"correct":true},{"text":{"en":"Sobek","fr":"Sobek","it":"Sobek"},"correct":false},{"text":{"en":"Hathor","fr":"Hathor","it":"Hathor"},"correct":false},{"text":{"en":"Bastet","fr":"Bastet","it":"Bastet"},"correct":false}]},{"text":{"en":"Which goddess was shown with the head of a cat?","fr":"Quelle déesse était représentée avec une tête de chat ?","it":"Quale dea era rappresentata con la testa di gatto?"},"explanation":{"en":"Bastet was the cat goddess. The Egyptians loved cats, and many families kept them at home.","fr":"Bastet était la déesse-chat. Les Égyptiens aimaient les chats, et beaucoup de familles en avaient chez elles.","it":"Bastet era la dea gatto. Gli Egizi amavano i gatti e molte famiglie li tenevano in casa."},"options":[{"text":{"en":"Bastet","fr":"Bastet","it":"Bastet"},"correct":true},{"text":{"en":"Hathor","fr":"Hathor","it":"Hathor"},"correct":false},{"text":{"en":"Nut","fr":"Nout","it":"Nut"},"correct":false},{"text":{"en":"Isis","fr":"Isis","it":"Iside"},"correct":false}]},{"text":{"en":"Which god had the head of an ibis (a bird with a long, curved beak) and was the god of writing and wisdom?","fr":"Quel dieu avait une tête d'ibis (un oiseau au long bec courbé) et était le dieu de l'écriture et de la sagesse ?","it":"Quale dio aveva la testa di ibis (un uccello dal lungo becco curvo) ed era il dio della scrittura e della saggezza?"},"explanation":{"en":"Thoth was the scribe of the gods. The Egyptians believed he invented writing.","fr":"Thot était le scribe des dieux. Les Égyptiens croyaient qu'il avait inventé l'écriture.","it":"Toth era lo scriba degli dèi. Gli Egizi credevano che avesse inventato la scrittura."},"options":[{"text":{"en":"Thoth","fr":"Thot","it":"Toth"},"correct":true},{"text":{"en":"Horus","fr":"Horus","it":"Horus"},"correct":false},{"text":{"en":"Sobek","fr":"Sobek","it":"Sobek"},"correct":false},{"text":{"en":"Ptah","fr":"Ptah","it":"Ptah"},"correct":false}]},{"text":{"en":"Which god ruled the land of the dead, as its king and judge?","fr":"Quel dieu régnait sur le pays des morts, comme roi et juge ?","it":"Quale dio governava il regno dei morti, come re e giudice?"},"explanation":{"en":"Osiris was the king of the underworld. He welcomed good people into the afterlife.","fr":"Osiris était le roi du monde des morts. Il accueillait les personnes bonnes dans l'au-delà.","it":"Osiride era il re del regno dei morti. Accoglieva le brave persone nell'aldilà."},"options":[{"text":{"en":"Osiris","fr":"Osiris","it":"Osiride"},"correct":true},{"text":{"en":"Ra","fr":"Rê","it":"Ra"},"correct":false},{"text":{"en":"Bastet","fr":"Bastet","it":"Bastet"},"correct":false},{"text":{"en":"Horus","fr":"Horus","it":"Horus"},"correct":false}]},{"text":{"en":"In a famous story, two brothers are rivals: one is kind and one is jealous. Which god of storms, the desert and chaos was the jealous brother?","fr":"Dans une célèbre histoire, deux frères sont rivaux : l'un est gentil, l'autre jaloux. Quel dieu de l'orage, du désert et du chaos était le frère jaloux ?","it":"In una famosa storia due fratelli sono rivali: uno è gentile e l'altro è geloso. Quale dio delle tempeste, del deserto e del caos era il fratello geloso?"},"explanation":{"en":"Seth was the god of chaos. He was jealous of his brother, but in the end order and justice won.","fr":"Seth était le dieu du chaos. Il était jaloux de son frère, mais à la fin l'ordre et la justice l'ont emporté.","it":"Seth era il dio del caos. Era geloso di suo fratello, ma alla fine hanno vinto l'ordine e la giustizia."},"options":[{"text":{"en":"Seth","fr":"Seth","it":"Seth"},"correct":true},{"text":{"en":"Thoth","fr":"Thot","it":"Toth"},"correct":false},{"text":{"en":"Ptah","fr":"Ptah","it":"Ptah"},"correct":false},{"text":{"en":"Geb","fr":"Geb","it":"Geb"},"correct":false}]},{"text":{"en":"Which goddess, famous for her powerful magic, helped bring her husband back to life?","fr":"Quelle déesse, célèbre pour sa puissante magie, a aidé son mari à revenir à la vie ?","it":"Quale dea, famosa per la sua potente magia, aiutò suo marito a tornare in vita?"},"explanation":{"en":"Isis was a great magician. She searched for her husband and used her magic to help him.","fr":"Isis était une grande magicienne. Elle a cherché son mari et a utilisé sa magie pour l'aider.","it":"Iside era una grande maga. Cercò suo marito e usò la sua magia per aiutarlo."},"options":[{"text":{"en":"Isis","fr":"Isis","it":"Iside"},"correct":true},{"text":{"en":"Hathor","fr":"Hathor","it":"Hathor"},"correct":false},{"text":{"en":"Nut","fr":"Nout","it":"Nut"},"correct":false},{"text":{"en":"Bastet","fr":"Bastet","it":"Bastet"},"correct":false}]},{"text":{"en":"Which god had the head of a crocodile and was linked to the River Nile?","fr":"Quel dieu avait une tête de crocodile et était lié au Nil ?","it":"Quale dio aveva la testa di coccodrillo ed era legato al fiume Nilo?"},"explanation":{"en":"Sobek was the crocodile god. The Egyptians respected crocodiles because they were strong and lived in the Nile.","fr":"Sobek était le dieu-crocodile. Les Égyptiens respectaient les crocodiles parce qu'ils étaient forts et vivaient dans le Nil.","it":"Sobek era il dio coccodrillo. Gli Egizi rispettavano i coccodrilli perché erano forti e vivevano nel Nilo."},"options":[{"text":{"en":"Sobek","fr":"Sobek","it":"Sobek"},"correct":true},{"text":{"en":"Anubis","fr":"Anubis","it":"Anubi"},"correct":false},{"text":{"en":"Ptah","fr":"Ptah","it":"Ptah"},"correct":false},{"text":{"en":"Geb","fr":"Geb","it":"Geb"},"correct":false}]},{"text":{"en":"Which goddess, shown with cow horns and a sun disk on her head, was the goddess of music, dance and joy?","fr":"Quelle déesse, représentée avec des cornes de vache et un disque solaire sur la tête, était la déesse de la musique, de la danse et de la joie ?","it":"Quale dea, rappresentata con corna di mucca e un disco solare sulla testa, era la dea della musica, della danza e della gioia?"},"explanation":{"en":"Hathor loved music and dancing. Many Egyptians asked her for happiness and good luck.","fr":"Hathor aimait la musique et la danse. Beaucoup d'Égyptiens lui demandaient le bonheur et la chance.","it":"Hathor amava la musica e la danza. Molti Egizi le chiedevano felicità e fortuna."},"options":[{"text":{"en":"Hathor","fr":"Hathor","it":"Hathor"},"correct":true},{"text":{"en":"Sekhmet","fr":"Sekhmet","it":"Sekhmet"},"correct":false},{"text":{"en":"Nut","fr":"Nout","it":"Nut"},"correct":false},{"text":{"en":"Bastet","fr":"Bastet","it":"Bastet"},"correct":false}]},{"text":{"en":"Which goddess was the sky itself? The Egyptians imagined her body stretched over the Earth, covered with stars.","fr":"Quelle déesse était le ciel lui-même ? Les Égyptiens imaginaient son corps étendu au-dessus de la Terre, couvert d'étoiles.","it":"Quale dea era il cielo stesso? Gli Egizi immaginavano il suo corpo steso sopra la Terra, coperto di stelle."},"explanation":{"en":"Nut was the sky goddess. Her husband Geb was the god of the Earth.","fr":"Nout était la déesse du ciel. Son mari Geb était le dieu de la Terre.","it":"Nut era la dea del cielo. Suo marito Geb era il dio della Terra."},"options":[{"text":{"en":"Nut","fr":"Nout","it":"Nut"},"correct":true},{"text":{"en":"Bastet","fr":"Bastet","it":"Bastet"},"correct":false},{"text":{"en":"Sekhmet","fr":"Sekhmet","it":"Sekhmet"},"correct":false},{"text":{"en":"Isis","fr":"Isis","it":"Iside"},"correct":false}]},{"text":{"en":"Which small insect was sacred in Egypt and a symbol of the rising sun?","fr":"Quel petit insecte était sacré en Égypte et symbolisait le soleil levant ?","it":"Quale piccolo insetto era sacro in Egitto e simbolo del sole che sorge?"},"explanation":{"en":"The scarab beetle rolls a ball of earth along the ground. The Egyptians imagined the sun being pushed across the sky in the same way.","fr":"Le scarabée roule une boule de terre sur le sol. Les Égyptiens imaginaient le soleil poussé dans le ciel de la même façon.","it":"Lo scarabeo rotola una palla di terra sul terreno. Gli Egizi immaginavano il sole spinto nel cielo allo stesso modo."},"options":[{"text":{"en":"The scarab beetle","fr":"Le scarabée","it":"Lo scarabeo"},"correct":true},{"text":{"en":"The ladybird","fr":"La coccinelle","it":"La coccinella"},"correct":false},{"text":{"en":"The butterfly","fr":"Le papillon","it":"La farfalla"},"correct":false},{"text":{"en":"The bee","fr":"L'abeille","it":"L'ape"},"correct":false}]},{"text":{"en":"What does the ankh, a cross with a loop on top, mean?","fr":"Que signifie l'ânkh, une croix surmontée d'une boucle ?","it":"Che cosa significa l'ankh, una croce con un anello in alto?"},"explanation":{"en":"The ankh means “life”. The gods are often shown holding it.","fr":"L'ânkh signifie « vie ». On voit souvent les dieux le tenir à la main.","it":"L'ankh significa «vita». Gli dèi sono spesso raffigurati mentre lo tengono in mano."},"options":[{"text":{"en":"Life","fr":"La vie","it":"La vita"},"correct":true},{"text":{"en":"Gold","fr":"L'or","it":"L'oro"},"correct":false},{"text":{"en":"Water","fr":"L'eau","it":"L'acqua"},"correct":false},{"text":{"en":"Night","fr":"La nuit","it":"La notte"},"correct":false}]},{"text":{"en":"In the afterlife, a dead person's heart was weighed on a big scale. What was it weighed against?","fr":"Dans l'au-delà, le cœur d'un mort était pesé sur une grande balance. Contre quoi était-il pesé ?","it":"Nell'aldilà il cuore di un defunto veniva pesato su una grande bilancia. Con che cosa veniva confrontato?"},"explanation":{"en":"The heart was weighed against the feather of Maat, goddess of truth and fairness. A good, honest heart was as light as the feather.","fr":"Le cœur était pesé contre la plume de Maât, déesse de la vérité et de la justice. Un cœur bon et honnête était aussi léger que la plume.","it":"Il cuore veniva pesato contro la piuma di Maat, dea della verità e della giustizia. Un cuore buono e onesto era leggero come la piuma."},"options":[{"text":{"en":"A feather","fr":"Une plume","it":"Una piuma"},"correct":true},{"text":{"en":"A stone","fr":"Une pierre","it":"Una pietra"},"correct":false},{"text":{"en":"A gold ring","fr":"Une bague en or","it":"Un anello d'oro"},"correct":false},{"text":{"en":"A drop of water","fr":"Une goutte d'eau","it":"Una goccia d'acqua"},"correct":false}]},{"text":{"en":"Which ram-headed god was said to shape people from clay on a potter's wheel?","fr":"Quel dieu à tête de bélier était censé modeler les humains avec de l'argile sur un tour de potier ?","it":"Quale dio con la testa di ariete modellava, secondo la leggenda, le persone con l'argilla su un tornio da vasaio?"},"explanation":{"en":"Khnum was the potter god. The Egyptians believed he made every person and gave them life.","fr":"Khnoum était le dieu potier. Les Égyptiens croyaient qu'il façonnait chaque personne et lui donnait la vie.","it":"Khnum era il dio vasaio. Gli Egizi credevano che modellasse ogni persona e le desse la vita."},"options":[{"text":{"en":"Khnum","fr":"Khnoum","it":"Khnum"},"correct":true},{"text":{"en":"Sobek","fr":"Sobek","it":"Sobek"},"correct":false},{"text":{"en":"Thoth","fr":"Thot","it":"Toth"},"correct":false},{"text":{"en":"Geb","fr":"Geb","it":"Geb"},"correct":false}]},{"text":{"en":"Why did the ancient Egyptians make mummies of their dead?","fr":"Pourquoi les Égyptiens de l'Antiquité fabriquaient-ils des momies ?","it":"Perché gli antichi Egizi trasformavano i defunti in mummie?"},"explanation":{"en":"They believed the body was needed in the next life, so they kept it safe.","fr":"Ils croyaient que le corps serait nécessaire dans la vie suivante, alors ils le conservaient précieusement.","it":"Credevano che il corpo servisse nella vita dopo la morte, perciò lo conservavano con cura."},"options":[{"text":{"en":"To keep the body safe for the next life","fr":"Pour garder le corps en bon état pour la vie suivante","it":"Per conservare il corpo per la vita dopo la morte"},"correct":true},{"text":{"en":"To decorate the tombs","fr":"Pour décorer les tombeaux","it":"Per decorare le tombe"},"correct":false},{"text":{"en":"To scare away robbers","fr":"Pour faire peur aux voleurs","it":"Per spaventare i ladri"},"correct":false},{"text":{"en":"To make statues of the gods","fr":"Pour fabriquer des statues des dieux","it":"Per fare statue degli dèi"},"correct":false}]},{"text":{"en":"Every year the Nile flooded and left rich black soil on its banks. Which god of the flood did the Egyptians thank?","fr":"Chaque année, le Nil débordait et laissait une terre noire et fertile sur ses rives. Quel dieu de la crue les Égyptiens remerciaient-ils ?","it":"Ogni anno il Nilo straripava e lasciava sulle sue rive una terra nera e fertile. Quale dio della piena ringraziavano gli Egizi?"},"explanation":{"en":"Hapi was the god of the Nile flood. Without the flood, farmers could not grow their crops.","fr":"Hâpy était le dieu de la crue du Nil. Sans la crue, les paysans ne pouvaient pas faire pousser leurs récoltes.","it":"Hapi era il dio della piena del Nilo. Senza la piena i contadini non potevano coltivare i campi."},"options":[{"text":{"en":"Hapi","fr":"Hâpy","it":"Hapi"},"correct":true},{"text":{"en":"Anubis","fr":"Anubis","it":"Anubi"},"correct":false},{"text":{"en":"Ptah","fr":"Ptah","it":"Ptah"},"correct":false},{"text":{"en":"Sekhmet","fr":"Sekhmet","it":"Sekhmet"},"correct":false}]},{"text":{"en":"The Great Sphinx, near the pyramids, has the body of a lion. What kind of head does it have?","fr":"Le Grand Sphinx, près des pyramides, a un corps de lion. Quelle sorte de tête a-t-il ?","it":"La Grande Sfinge, vicino alle piramidi, ha il corpo di un leone. Che tipo di testa ha?"},"explanation":{"en":"The Great Sphinx has a human head. It guards the pyramids at Giza.","fr":"Le Grand Sphinx a une tête humaine. Il veille sur les pyramides de Gizeh.","it":"La Grande Sfinge ha una testa umana. Fa la guardia alle piramidi di Giza."},"options":[{"text":{"en":"A human head","fr":"Une tête humaine","it":"Una testa umana"},"correct":true},{"text":{"en":"An eagle's head","fr":"Une tête d'aigle","it":"Una testa d'aquila"},"correct":false},{"text":{"en":"A crocodile's head","fr":"Une tête de crocodile","it":"Una testa di coccodrillo"},"correct":false},{"text":{"en":"A snake's head","fr":"Une tête de serpent","it":"Una testa di serpente"},"correct":false}]},{"text":{"en":"What is the name of the picture writing the ancient Egyptians used?","fr":"Comment s'appelle l'écriture en images utilisée par les Égyptiens de l'Antiquité ?","it":"Come si chiama la scrittura a immagini usata dagli antichi Egizi?"},"explanation":{"en":"Hieroglyphs use little pictures for words and sounds. Only trained scribes could write them well.","fr":"Les hiéroglyphes utilisent de petits dessins pour représenter des mots et des sons. Seuls les scribes formés savaient bien les écrire.","it":"I geroglifici usano piccoli disegni per parole e suoni. Solo gli scribi addestrati sapevano scriverli bene."},"options":[{"text":{"en":"Hieroglyphs","fr":"Les hiéroglyphes","it":"I geroglifici"},"correct":true},{"text":{"en":"Runes","fr":"Les runes","it":"Le rune"},"correct":false},{"text":{"en":"Cuneiform","fr":"L'écriture cunéiforme","it":"La scrittura cuneiforme"},"correct":false},{"text":{"en":"Braille","fr":"Le braille","it":"Il braille"},"correct":false}]},{"text":{"en":"According to the myths, how did the sun god travel across the sky each day?","fr":"Selon les mythes, comment le dieu du soleil traversait-il le ciel chaque jour ?","it":"Secondo i miti, come attraversava ogni giorno il cielo il dio del Sole?"},"explanation":{"en":"Ra sailed across the sky in a magical boat. At night the boat sailed through the underworld, and in the morning the sun rose again.","fr":"Rê traversait le ciel à bord d'une barque magique. La nuit, la barque naviguait dans le monde souterrain, et le matin le soleil se levait de nouveau.","it":"Ra attraversava il cielo su una barca magica. Di notte la barca navigava nel mondo sotterraneo e al mattino il sole sorgeva di nuovo."},"options":[{"text":{"en":"In a boat","fr":"Dans une barque","it":"Su una barca"},"correct":true},{"text":{"en":"On a camel","fr":"À dos de chameau","it":"In groppa a un cammello"},"correct":false},{"text":{"en":"In a chariot","fr":"Dans un char","it":"Su un carro"},"correct":false},{"text":{"en":"On a giant bird","fr":"Sur un oiseau géant","it":"Su un uccello gigante"},"correct":false}]}],"index_url":"index.html"}</script>

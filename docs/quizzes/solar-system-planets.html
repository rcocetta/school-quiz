mallest planet in our solar system, only slightly larger than Earth's Moon.","fr":"Mercure est la plus petite planète de notre système solaire, seulement légèrement plus grande que la Lune de la Terre.","it":"Mercurio è il pianeta più piccolo del nostro sistema solare, solo leggermente più grande della Luna terrestre."},"options":[{"text":{"en":"Pluto","fr":"Pluton","it":"Plutone"},"correct":false},{"text":{"en":"Mercury","fr":"Mercure","it":"Mercurio"},"correct":true},{"text":{"en":"Mars","fr":"Mars","it":"Marte"},"correct":false},{"text":{"en":"Venus","fr":"Vénus","it":"Venere"},"correct":false}]},{"text":{"en":"Which planet is known as the Blue Planet?","fr":"Quelle planète est appelée la Planète Bleue ?","it":"Quale pianeta è chiamato il Pianeta Blu?"},"explanation":{"en":"Earth appears blue from space because about 71% of its surface is covered by water.","fr":"La Terre paraît bleue depuis l'espace car environ 71 % de sa surface est recouverte d'eau.","it":"La Terra appare blu dallo spazio perché circa il 71% della sua superficie è coperta da acqua."},"options":[{"text":{"en":"Earth","fr":"Terre","it":"Terra"},"correct":true},{"text":{"en":"Neptune","fr":"Neptune","it":"Nettuno"},"correct":false},{"text":{"en":"Uranus","fr":"Uranus","it":"Urano"},"correct":false},{"text":{"en":"Saturn","fr":"Saturne","it":"Saturno"},"correct":false}]},{"text":{"en":"Which planet spins on its side?","fr":"Quelle planète tourne sur le côté ?","it":"Quale pianeta ruota su un lato?"},"explanation":{"en":"Uranus rotates on its side with an axial tilt of about 98 degrees, making it appear to roll around the Sun.","fr":"Uranus tourne sur le côté avec une inclinaison axiale d'environ 98 degrés, ce qui lui donne l'air de rouler autour du Soleil.","it":"Urano ruota su un lato con un'inclinazione assiale di circa 98 gradi, facendolo sembrare rotolare intorno al Sole."},"options":[{"text":{"en":"Jupiter","fr":"Jupiter","it":"Giove"},"correct":false},{"text":{"en":"Uranus","fr":"Uranus","it":"Urano"},"correct":true},{"text":{"en":"Saturn","fr":"Saturne","it":"Saturno"},"correct":false},{"text":{"en":"Neptune","fr":"Neptune","it":"Nettuno"},"correct":false}]},{"text":{"en":"Which planet is farthest from the Sun?","fr":"Quelle planète est la plus éloignée du Soleil ?","it":"Quale pianeta è il più lontano dal Sole?"},"explanation":{"en":"Neptune is the eighth and farthest planet from the Sun, about 4.5 billion kilometers away.","fr":"Neptune est la huitième planète et la plus éloignée du Soleil, à environ 4,5 milliards de kilomètres.","it":"Nettuno è l'ottavo pianeta e il più lontano dal Sole, a circa 4,5 miliardi di chilometri di distanza."},"options":[{"text":{"en":"Uranus","fr":"Uranus","it":"Urano"},"correct":false},{"text":{"en":"Neptune","fr":"Neptune","it":"Nettuno"},"correct":true},{"text":{"en":"Saturn","fr":"Saturne","it":"Saturno"},"correct":false},{"text":{"en":"Pluto","fr":"Pluton","it":"Plutone"},"correct":false}]},{"text":{"en":"What is the name of Earth's natural satellite?","fr":"Quel est le nom du satellite naturel de la Terre ?","it":"Qual è il nome del satellite naturale della Terra?"},"explanation":{"en":"The Moon is Earth's only natural satellite, orbiting our planet for billions of years.","fr":"La Lune est le seul satellite naturel de la Terre, en orbite autour de notre planète depuis des milliards d'années.","it":"La Luna è l'unico satellite naturale della Terra, in orbita intorno al nostro pianeta da miliardi di anni."},"options":[{"text":{"en":"Phobos","fr":"Phobos","it":"Fobos"},"correct":false},{"text":{"en":"Moon","fr":"Lune","it":"Luna"},"correct":true},{"text":{"en":"Deimos","fr":"Deimos","it":"Deimos"},"correct":false},{"text":{"en":"Io","fr":"Io","it":"Io"},"correct":false}]},{"text":{"en":"Which planet is between Earth and Jupiter?","fr":"Quelle planète se trouve entre la Terre et Jupiter ?","it":"Quale pianeta si trova tra la Terra e Giove?"},"explanation":{"en":"The planets in order from the Sun are: Mercury, Venus, Earth, Mars, Jupiter. So Mars is between Earth and Jupiter.","fr":"Les planètes dans l'ordre à partir du Soleil sont : Mercure, Vénus, Terre, Mars, Jupiter. Donc Mars se trouve entre la Terre et Jupiter.","it":"I pianeti in ordine dal Sole sono: Mercurio, Venere, Terra, Marte, Giove. Quindi Marte si trova tra la Terra e Giove."},"options":[{"text":{"en":"Mars","fr":"Mars","it":"Marte"},"correct":true},{"text":{"en":"Venus","fr":"Vénus","it":"Venere"},"correct":false},{"text":{"en":"Saturn","fr":"Saturne","it":"Saturno"},"correct":false},{"text":{"en":"Mercury","fr":"Mercure","it":"Mercurio"},"correct":false}]},{"text":{"en":"Which planet has a Great Red Spot?","fr":"Quelle planète possède une Grande Tache Rouge ?","it":"Quale pianeta ha una Grande Macchia Rossa?"},"explanation":{"en":"Jupiter has a massive storm called the Great Red Spot that has been raging for hundreds of years.","fr":"Jupiter possède une tempête géante appelée la Grande Tache Rouge qui fait rage depuis des centaines d'années.","it":"Giove ha una tempesta massiccia chiamata Grande Macchia Rossa che infuria da centinaia di anni."},"options":[{"text":{"en":"Jupiter","fr":"Jupiter","it":"Giove"},"correct":true},{"text":{"en":"Saturn","fr":"Saturne","it":"Saturno"},"correct":false},{"text":{"en":"Neptune","fr":"Neptune","it":"Nettuno"},"correct":false},{"text":{"en":"Mars","fr":"Mars","it":"Marte"},"correct":false}]},{"text":{"en":"Which planet is most similar in size to Earth?","fr":"Quelle planète a une taille la plus proche de celle de la Terre ?","it":"Quale pianeta ha una dimensione più simile a quella della Terra?"},"explanation":{"en":"Venus is often called Earth's sister planet because they are very similar in size and mass.","fr":"Vénus est souvent appelée la planète sœur de la Terre car elles sont très similaires en taille et en masse.","it":"Venere viene spesso chiamata il pianeta gemello della Terra perché sono molto simili in dimensioni e massa."},"options":[{"text":{"en":"Venus","fr":"Vénus","it":"Venere"},"correct":true},{"text":{"en":"Mars","fr":"Mars","it":"Marte"},"correct":false},{"text":{"en":"Mercury","fr":"Mercure","it":"Mercurio"},"correct":false},{"text":{"en":"Neptune","fr":"Neptune","it":"Nettuno"},"correct":false}]},{"text":{"en":"How many planets are in our solar system?","fr":"Combien y a-t-il de planètes dans notre système solaire ?","it":"Quanti pianeti ci sono nel nostro sistema solare?"},"explanation":{"en":"There are 8 planets in our solar system: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, and Neptune.","fr":"Il y a 8 planètes dans notre système solaire : Mercure, Vénus, Terre, Mars, Jupiter, Saturne, Uranus et Neptune.","it":"Ci sono 8 pianeti nel nostro sistema solare: Mercurio, Venere, Terra, Marte, Giove, Saturno, Urano e Nettuno."},"options":[{"text":{"en":"8","fr":"8","it":"8"},"correct":true},{"text":{"en":"9","fr":"9","it":"9"},"correct":false},{"text":{"en":"10","fr":"10","it":"10"},"correct":false},{"text":{"en":"7","fr":"7","it":"7"},"correct":false}]},{"text":{"en":"Which planet is known as the Morning Star or Evening Star?","fr":"Quelle planète est appelée l'Étoile du Matin ou l'Étoile du Soir ?","it":"Quale pianeta è chiamato Stella del Mattino o Stella della Sera?"},"explanation":{"en":"Venus appears very bright in the sky and can be seen just before sunrise or just after sunset.","fr":"Vénus paraît très brillante dans le ciel et peut être vue juste avant le lever du soleil ou juste après le coucher du soleil.","it":"Venere appare molto luminosa nel cielo e può essere vista poco prima dell'alba o poco dopo il tramonto."},"options":[{"text":{"en":"Venus","fr":"Vénus","it":"Venere"},"correct":true},{"text":{"en":"Mercury","fr":"Mercure","it":"Mercurio"},"correct":false},{"text":{"en":"Mars","fr":"Mars","it":"Marte"},"correct":false},{"text":{"en":"Jupiter","fr":"Jupiter","it":"Giove"},"correct":false}]},{"text":{"en":"Which gas giant planets have rings?","fr":"Quelles planètes géantes gazeuses possèdent des anneaux ?","it":"Quali pianeti gassosi hanno anelli?"},"explanation":{"en":"All four gas giants (Jupiter, Saturn, Uranus, and Neptune) have ring systems, but Saturn's are the most visible.","fr":"Les quatre géantes gazeuses (Jupiter, Saturne, Uranus et Neptune) possèdent des systèmes d'anneaux, mais ceux de Saturne sont les plus visibles.","it":"Tutti e quattro i giganti gassosi (Giove, Saturno, Urano e Nettuno) hanno sistemi di anelli, ma quelli di Saturno sono i più visibili."},"options":[{"text":{"en":"Jupiter and Saturn only","fr":"Jupiter et Saturne seulement","it":"Solo Giove e Saturno"},"correct":false},{"text":{"en":"All four gas giants","fr":"Les quatre géantes gazeuses","it":"Tutti e quattro i giganti gassosi"},"correct":true},{"text":{"en":"Saturn and Uranus only","fr":"Saturne et Uranus seulement","it":"Solo Saturno e Urano"},"correct":false},{"text":{"en":"Neptune and Uranus only","fr":"Neptune et Uranus seulement","it":"Solo Nettuno e Urano"},"correct":false}]},{"text":{"en":"Which planet has the shortest year?","fr":"Quelle planète a l'année la plus courte ?","it":"Quale pianeta ha l'anno più corto?"},"explanation":{"en":"Mercury orbits the Sun the fastest, completing one orbit in just 88 Earth days.","fr":"Mercure orbite autour du Soleil le plus rapidement, complétant une orbite en seulement 88 jours terrestres.","it":"Mercurio orbita intorno al Sole più velocemente, completando un'orbita in soli 88 giorni terrestri."},"options":[{"text":{"en":"Mercury","fr":"Mercure","it":"Mercurio"},"correct":true},{"text":{"en":"Venus","fr":"Vénus","it":"Venere"},"correct":false},{"text":{"en":"Earth","fr":"Terre","it":"Terra"},"correct":false},{"text":{"en":"Mars","fr":"Mars","it":"Marte"},"correct":false}]},{"text":{"en":"Which planet has the longest day?","fr":"Quelle planète a le jour le plus long ?","it":"Quale pianeta ha il giorno più lungo?"},"explanation":{"en":"Venus rotates very slowly on its axis, taking about 243 Earth days to complete one rotation.","fr":"Vénus tourne très lentement sur son axe, mettant environ 243 jours terrestres pour effectuer une rotation.","it":"Venere ruota molto lentamente sul suo asse, impiegando circa 243 giorni terrestri per completare una rotazione."},"options":[{"text":{"en":"Jupiter","fr":"Jupiter","it":"Giove"},"correct":false},{"text":{"en":"Venus","fr":"Vénus","it":"Venere"},"correct":true},{"text":{"en":"Mercury","fr":"Mercure","it":"Mercurio"},"correct":false},{"text":{"en":"Neptune","fr":"Neptune","it":"Nettuno"},"correct":false}]},{"text":{"en":"Which planet is named after the Roman god of the sea?","fr":"Quelle planète porte le nom du dieu romain de la mer ?","it":"Quale pianeta prende il nome dal dio romano del mare?"},"explanation":{"en":"Neptune was named after the Roman god of the sea because of its deep blue color.","fr":"Neptune a été nommée d'après le dieu romain de la mer en raison de sa couleur bleu profond.","it":"Nettuno è stato chiamato così in onore del dio romano del mare a causa del suo colore blu scuro."},"options":[{"text":{"en":"Uranus","fr":"Uranus","it":"Urano"},"correct":false},{"text":{"en":"Neptune","fr":"Neptune","it":"Nettuno"},"correct":true},{"text":{"en":"Saturn","fr":"Saturne","it":"Saturno"},"correct":false},{"text":{"en":"Jupiter","fr":"Jupiter","it":"Giove"},"correct":false}]},{"text":{"en":"Which planet is the windiest?","fr":"Quelle est la planète la plus venteuse ?","it":"Quale pianeta è il più ventoso?"},"explanation":{"en":"Neptune has the strongest winds in the solar system, reaching speeds of over 2,000 km/h.","fr":"Neptune possède les vents les plus forts du système solaire, atteignant des vitesses supérieures à 2 000 km/h.","it":"Nettuno ha i venti più forti del sistema solare, che raggiungono velocità superiori a 2.000 km/h."},"options":[{"text":{"en":"Jupiter","fr":"Jupiter","it":"Giove"},"correct":false},{"text":{"en":"Saturn","fr":"Saturne","it":"Saturno"},"correct":false},{"text":{"en":"Neptune","fr":"Neptune","it":"Nettuno"},"correct":true},{"text":{"en":"Uranus","fr":"Uranus","it":"Urano"},"correct":false}]},{"text":{"en":"What are the four terrestrial (rocky) planets?","fr":"Quelles sont les quatre planètes telluriques (rocheuses) ?","it":"Quali sono i quattro pianeti terrestri (rocciosi)?"},"explanation":{"en":"The four terrestrial planets are Mercury, Venus, Earth, and Mars. They are made of rock and metal.","fr":"Les quatre planètes telluriques sont Mercure, Vénus, la Terre et Mars. Elles sont composées de roche et de métal.","it":"I quattro pianeti terrestri sono Mercurio, Venere, Terra e Marte. Sono composti da roccia e metallo."},"options":[{"text":{"en":"Mercury, Venus, Earth, Mars","fr":"Mercure, Vénus, Terre, Mars","it":"Mercurio, Venere, Terra, Marte"},"correct":true},{"text":{"en":"Jupiter, Saturn, Uranus, Neptune","fr":"Jupiter, Saturne, Uranus, Neptune","it":"Giove, Saturno, Urano, Nettuno"},"correct":false},{"text":{"en":"Venus, Earth, Mars, Jupiter","fr":"Vénus, Terre, Mars, Jupiter","it":"Venere, Terra, Marte, Giove"},"correct":false},{"text":{"en":"Earth, Mars, Jupiter, Saturn","fr":"Terre, Mars, Jupiter, Saturne","it":"Terra, Marte, Giove, Saturno"},"correct":false}]},{"text":{"en":"Which planet has the most volcanoes in the solar system?","fr":"Quelle planète possède le plus de volcans dans le système solaire ?","it":"Quale pianeta ha il maggior numero di vulcani nel sistema solare?"},"explanation":{"en":"Venus has more volcanoes than any other planet in our solar system, with over 1,600 major volcanic features.","fr":"Vénus possède plus de volcans que toute autre planète de notre système solaire, avec plus de 1 600 formations volcaniques majeures.","it":"Venere ha più vulcani di qualsiasi altro pianeta nel nostro sistema solare, con oltre 1.600 principali caratteristiche vulcaniche."},"options":[{"text":{"en":"Earth","fr":"Terre","it":"Terra"},"correct":false},{"text":{"en":"Mars","fr":"Mars","it":"Marte"},"correct":false},{"text":{"en":"Venus","fr":"Vénus","it":"Venere"},"correct":true},{"text":{"en":"Io (Jupiter's moon)","fr":"Io (lune de Jupiter)","it":"Io (luna di Giove)"},"correct":false}]},{"text":{"en":"Which planet has the largest canyon in the solar system?","fr":"Quelle planète possède le plus grand canyon du système solaire ?","it":"Quale pianeta ha il canyon più grande del sistema solare?"},"explanation":{"en":"Mars has Valles Marineris, a canyon system that is about 4,000 km long, much larger than Earth's Grand Canyon.","fr":"Mars possède Valles Marineris, un système de canyons d'environ 4 000 km de long, bien plus grand que le Grand Canyon terrestre.","it":"Marte ha Valles Marineris, un sistema di canyon lungo circa 4.000 km, molto più grande del Grand Canyon terrestre."},"options":[{"text":{"en":"Earth","fr":"Terre","it":"Terra"},"correct":false},{"text":{"en":"Mars","fr":"Mars","it":"Marte"},"correct":true},{"text":{"en":"Venus","fr":"Vénus","it":"Venere"},"correct":false},{"text":{"en":"Mercury","fr":"Mercure","it":"Mercurio"},"correct":false}]},{"text":{"en":"Which planet has a thick atmosphere made mostly of carbon dioxide?","fr":"Quelle planète possède une atmosphère épaisse composée principalement de dioxyde de carbone ?","it":"Quale pianeta ha un'atmosfera densa composta principalmente da anidride carbonica?"},"explanation":{"en":"Venus has a very thick atmosphere that is about 96.5% carbon dioxide, which creates a strong greenhouse effect.","fr":"Vénus possède une atmosphère très épaisse composée à environ 96,5 % de dioxyde de carbone, ce qui crée un fort effet de serre.","it":"Venere ha un'atmosfera molto densa composta per circa il 96,5% da anidride carbonica, che crea un forte effetto serra."},"options":[{"text":{"en":"Earth","fr":"Terre","it":"Terra"},"correct":false},{"text":{"en":"Venus","fr":"Vénus","it":"Venere"},"correct":true},{"text":{"en":"Mars","fr":"Mars","it":"Marte"},"correct":false},{"text":{"en":"Jupiter","fr":"Jupiter","it":"Giove"},"correct":false}]},{"text":{"en":"Which planet was th ngest magnetic field?","fr":"Quelle planète possède le champ magnétique le plus puissant ?","it":"Quale pianeta ha il campo magnetico più forte?"},"explanation":{"en":"Jupiter has the strongest magnetic field of all planets, about 20,000 times stronger than Earth's.","fr":"Jupiter possède le champ magnétique le plus puissant de toutes les planètes, environ 20 000 fois plus puissant que celui de la Terre.","it":"Giove ha il campo magnetico più forte di tutti i pianeti, circa 20.000 volte più forte di quello della Terra."},"options":[{"text":{"en":"Earth","fr":"Terre","it":"Terra"},"correct":false},{"text":{"en":"Jupiter","fr":"Jupiter","it":"Giove"},"correct":true},{"text":{"en":"Saturn","fr":"Saturne","it":"Saturno"},"correct":false},{"text":{"en":"Neptune","fr":"Neptune","it":"Nettuno"},"correct":false}]},{"text":{"en":"What is the name of the largest moon of Saturn?","fr":"Quel est le nom de la plus grande lune de Saturne ?","it":"Qual è il nome della luna più grande di Saturno?"},"explanation":{"en":"Titan is Saturn's largest moon and the second-largest moon in the solar system after Jupiter's Ganymede.","fr":"Titan est la plus grande lune de Saturne et la deuxième plus grande lune du système solaire après Ganymède de Jupiter.","it":"Titan è la luna più grande di Saturno e la seconda luna più grande del sistema solare dopo Ganimede di Giove."},"options":[{"text":{"en":"Titan","fr":"Titan","it":"Titano"},"correct":true},{"text":{"en":"Rhea","fr":"Rhéa","it":"Rea"},"correct":false},{"text":{"en":"Iapetus","fr":"Japet","it":"Giapeto"},"correct":false},{"text":{"en":"Dione","fr":"Dioné","it":"Dione"},"correct":false}]},{"text":{"en":"Which planet has polar ice caps made of water ice and dry ice?","fr":"Quelle planète possède des calottes polaires composées de glace d'eau et de glace sèche ?","it":"Quale pianeta ha calotte polari composte da ghiaccio d'acqua e ghiaccio secco?"},"explanation":{"en":"Mars has polar ice caps made of both water ice and frozen carbon dioxi

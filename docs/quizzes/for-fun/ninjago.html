rt of Possession?","fr":"Que fait Sensei Wu pendant sa retraite au début de Possession ?"},"explanation":{"en":"He asks the ninja to help advertise it.","fr":"Il demande aux ninjas de l'aider à faire de la publicité."},"options":[{"text":{"en":"He opens a tea shop","fr":"Il ouvre un salon de thé"},"correct":true},{"text":{"en":"He becomes a pilot","fr":"Il devient pilote"},"correct":false},{"text":{"en":"He joins a circus","fr":"Il rejoint un cirque"},"correct":false},{"text":{"en":"He opens a museum","fr":"Il ouvre un musée"},"correct":false}]},{"text":{"en":"Who is Morro?","fr":"Qui est Morro ?"},"explanation":{"en":"He escaped from the Cursed Realm.","fr":"Il s'est échappé du Royaume maudit."},"options":[{"text":{"en":"Wu's first student, the Master of Wind","fr":"Le premier élève de Wu, le Maître du vent"},"correct":true},{"text":{"en":"Garmadon's son and Lloyd's older brother","fr":"Le fils de Garmadon et le grand frère de Lloyd"},"correct":false},{"text":{"en":"A Stone Army warrior sent by the Overlord","fr":"Un guerrier de l'armée de pierre envoyé par l'Overlord"},"correct":false},{"text":{"en":"A Djinn prince from the realm of Djinjago","fr":"Un prince Djinn venu du royaume de Djinjago"},"correct":false}]},{"text":{"en":"What does Morro do to Lloyd?","fr":"Que fait Morro à Lloyd ?"},"explanation":{"en":"Morro uses Lloyd's body to attack the other ninja.","fr":"Morro utilise le corps de Lloyd pour attaquer les autres ninjas."},"options":[{"text":{"en":"He possesses him","fr":"Il le possède"},"correct":true},{"text":{"en":"He turns him to stone","fr":"Il le transforme en pierre"},"correct":false},{"text":{"en":"He locks him in a teapot","fr":"Il l'enferme dans une théière"},"correct":false},{"text":{"en":"He freezes him","fr":"Il le gèle"},"correct":false}]},{"text":{"en":"Which ninja turns into a ghost because of the curse?","fr":"Quel ninja devient un fantôme à cause de la malédiction ?"},"explanation":{"en":"He still keeps his free will.","fr":"Il garde pourtant son libre arbitre."},"options":[{"text":{"en":"Cole","fr":"Cole"},"correct":true},{"text":{"en":"Jay","fr":"Jay"},"correct":false},{"text":{"en":"Kai","fr":"Kai"},"correct":false},{"text":{"en":"Zane","fr":"Zane"},"correct":false}]},{"text":{"en":"What does Morro use to summon an army of ghosts?","fr":"Que Morro utilise-t-il pour invoquer une armée de fantômes ?"},"explanation":{"en":"Wu later uses the same crystal to bring Lloyd back to Ninjago.","fr":"Wu utilise plus tard le même cristal pour ramener Lloyd à Ninjago."},"options":[{"text":{"en":"The Realm Crystal","fr":"Le Cristal du Royaume"},"correct":true},{"text":{"en":"The Staff of Elements","fr":"Le Bâton des Éléments"},"correct":false},{"text":{"en":"The Helmet of Shadows","fr":"Le Casque des Ombres"},"correct":false},{"text":{"en":"The Djinn Blade","fr":"La Lame des Djinns"},"correct":false}]},{"text":{"en":"Which of these is one of Morro's ghost lieutenants?","fr":"Lequel de ces personnages est un lieutenant fantôme de Morro ?"},"explanation":{"en":"The others are Soul Archer, Ghoultar and Wrayth.","fr":"Les autres sont Soul Archer, Ghoultar et Wrayth."},"options":[{"text":{"en":"Bansha","fr":"Bansha"},"correct":true},{"text":{"en":"Pythor","fr":"Pythor"},"correct":false},{"text":{"en":"Skylor","fr":"Skylor"},"correct":false},{"text":{"en":"Dareth","fr":"Dareth"},"correct":false}]},{"text":{"en":"How is Morro finally defeated?","fr":"Comment Morro est-il finalement vaincu ?"},"explanation":{"en":"He is pulled into the sea.","fr":"Il est entraîné dans la mer."},"options":[{"text":{"en":"Water dissolves him","fr":"L'eau le dissout"},"correct":true},{"text":{"en":"He is frozen","fr":"Il est gelé"},"correct":false},{"text":{"en":"He is struck by lightning","fr":"Il est frappé par la foudre"},"correct":false},{"text":{"en":"He is trapped in a teapot","fr":"Il est enfermé dans une théière"},"correct":false}]},{"text":{"en":"In Skybound, who is Nadakhan?","fr":"Dans Skybound, qui est Nadakhan ?"},"explanati ted and his real father is the actor Cliff Gordon","fr":"Qu'il a été adopté et que son vrai père est l'acteur Cliff Gordon"},"correct":true},{"text":{"en":"That he is a Djinn from Djinjago and a cousin of Nadakhan","fr":"Qu'il est un Djinn de Djinjago et un cousin de Nadakhan"},"correct":false},{"text":{"en":"That he is Wu's long-lost grandson and the true Green Ninja","fr":"Qu'il est le petit-fils perdu de vue de Wu et le vrai Ninja vert"},"correct":false},{"text":{"en":"That he is a Nindroid secretly built by Dr. Julien long ago","fr":"Qu'il est un Nindroïde construit en secret par le Dr Julien"},"correct":false}]},{"text":{"en":"Which weapon holds the souls of Clouse, Wu and Misako?","fr":"Quelle arme contient les âmes de Clouse, Wu et Misako ?"},"explanation":{"en":"Nadakhan slashes the Teapot of Tyrahn with it.","fr":"Nadakhan en frappe la Théière de Tyrahn."},"options":[{"text":{"en":"The Djinn Blade","fr":"La Lame des Djinns"},"correct":true},{"text":{"en":"The Staff of Elements","fr":"Le Bâton des Éléments"},"correct":false},{"text":{"en":"The Scythe of Quakes","fr":"La Faux des Séismes"},"correct":false},{"text":{"en":"The Sword of Fire","fr":"L'Épée du feu"},"correct":false}]},{"text":{"en":"What does Nadakhan plan to build after Djinjago starts to collapse?","fr":"Que Nadakhan prévoit-il de construire après l'effondrement de Djinjago ?"},"explanation":{"en":"He blames the ninja for the destruction of his home.","fr":"Il accuse les ninjas d'avoir détruit son monde."},"options":[{"text":{"en":"A New Djinjago, by raising pieces of Ninjago into the sky","fr":"Un Nouveau Djinjago, en élevant des morceaux de Ninjago dans le ciel"},"correct":true},{"text":{"en":"An underwater city built for all the Djinn and his pirates","fr":"Une ville sous-marine construite pour tous les Djinn et ses pirates"},"correct":false},{"text":{"en":"A new Underworld for the skeleton army and its new king","fr":"Un nouveau Monde souterrain pour l'armée de squelettes et son nouveau roi"},"correct":false},{"text":{"en":"A giant ship to sail across all the realms with his crew","fr":"Un navire géant pour naviguer entre tous les royaumes avec son équipage"},"correct":false}]},{"text":{"en":"How does Skybound end after Jay's final wish?","fr":"Comment Skybound se termine-t-il après le dernier vœu de Jay ?"},"explanation":{"en":"Jay makes the wish that saves everyone.","fr":"Jay fait le vœu qui sauve tout le monde."},"options":[{"text":{"en":"The events of the season are reversed","fr":"Les événements de la saison sont annulés"},"correct":true},{"text":{"en":"The ninja leave Ninjago for good","fr":"Les ninjas quittent Ninjago pour toujours"},"correct":false},{"text":{"en":"Nadakhan wins and rules over Ninjago","fr":"Nadakhan gagne et règne sur Ninjago"},"correct":false},{"text":{"en":"Jay becomes a Djinn and joins the pirates","fr":"Jay devient un Djinn et rejoint les pirates"},"correct":false}]},{"text":{"en":"Who are the Time Twins in The Hands of Time?","fr":"Qui sont les Jumeaux du Temps dans The Hands of Time ?"},"explanation":{"en":"Wu fought Acronix 40 years earlier.","fr":"Wu avait combattu Acronix 40 ans plus tôt."},"options":[{"text":{"en":"Acronix and Krux","fr":"Acronix et Krux"},"correct":true},{"text":{"en":"Pythor and Chen","fr":"Pythor et Chen"},"correct":false},{"text":{"en":"Morro and Bansha","fr":"Morro et Bansha"},"correct":false},{"text":{"en":"Harumi and Skylor","fr":"Harumi et Skylor"},"correct":false}]},{"text":{"en":"What happens to Wu when Acronix hits him with the Time Punch?","fr":"Que se passe-t-il quand Acronix frappe Wu avec le coup du Temps ?"},"explanation":{"en":"Acronix then escapes and meets his twin again.","fr":"Acronix s'échappe ensuite et retrouve son jumeau."},"options":[{"text":{"en":"He starts to age very fast","fr":"Il se met à vieillir très vite"},"correct":true},{"text":{"en":"He turns to stone","fr":"Il se transforme en pierre"},"correct":false},{"text":{"en":"He becomes invisible","fr":"Il devient invisible"},"correct":false},{"text":{"en":"He disappears","fr":"Il disparaît"},"correct":false}]},{"text":{"en":"Under which name has Krux been hiding for 40 years?","fr":"Sous quel nom Krux se cache-t-il depuis 40 ans ?"},"explanation":{"en":"He has also been breeding the Vermillion Warriors.","fr":"Il a aussi élevé les guerriers Vermillion."},"options":[{"text":{"en":"Dr. Sander Saunders","fr":"Dr Sander Saunders"},"correct":true},{"text":{"en":"Cyrus Borg","fr":"Cyrus Borg"},"correct":false},{"text":{"en":"Doctor Julien","fr":"Docteur Julien"},"correct":false},{"text":{"en":"Professor Yang","fr":"Professeur Yang"},"correct":false}]},{"text":{"en":"Who leads the Sons of Garmadon, a biker gang?","fr":"Qui dirige les Fils de Garmadon, une bande de motards ?"},"explanation":{"en":"She is the main villain of the season.","fr":"Elle est le principal méchant de la saison."},"options":[{"text":{"en":"Harumi","fr":"Harumi"},"correct":true},{"text":{"en":"Skylor","fr":"Skylor"},"correct":false},{"text":{"en":"Misako","fr":"Misako"},"correct":false},{"text":{"en":"P.I.X.A.L.","fr":"P.I.X.A.L."},"correct":false}]},{"text":{"en":"What does Harumi plan to steal to bring Lord Garmadon back?","fr":"Que Harumi prévoit-elle de voler pour ramener Lord Garmadon ?"},"explanation":{"en":"He would come back in a purely evil form.","fr":"Il reviendrait sous une forme purement maléfique."},"options":[{"text":{"en":"Three Oni masks","fr":"Trois masques Oni"},"correct":true},{"text":{"en":"Three Golden Weapons","fr":"Trois Armes d'or"},"correct":false},{"text":{"en":"Three dragon cores","fr":"Trois cœurs de dragon"},"correct":false},{"text":{"en":"Three Djinn blades","fr":"Trois lames de Djinn"},"correct":false}]},{"text":{"en":"In Hunted, where are Kai, Cole, Jay, Zane and Wu stranded?","fr":"Dans Hunted, où Kai, Cole, Jay, Zane et Wu sont-ils bloqués ?"},"explanation":{"en":"Wu also changes age along the way.","fr":"Wu change aussi d'âge en cours de route."},"options":[{"text":{"en":"The Realm

<script type="application/json" id="quiz-data">{"title":{"en":"Doctor Who"},"description":{"en":"50 questions about Doctor Who since 2005, from the Ninth Doctor onwards. Each game asks you 10."},"languages":["en"],"questions_per_quiz":10,"feedback":"immediate","shuffle_options":true,"questions":[{"text":{"en":"Which actor played the Ninth Doctor when Doctor Who came back in 2005?"},"explanation":{"en":"Christopher Eccleston played the Ninth Doctor in the first series of the new Doctor Who, in 2005."},"options":[{"text":{"en":"Christopher Eccleston"},"correct":true},{"text":{"en":"David Tennant"},"correct":false},{"text":{"en":"Matt Smith"},"correct":false},{"text":{"en":"John Hurt"},"correct":false}]},{"text":{"en":"Who played the Tenth Doctor?"},"explanation":{"en":"David Tennant was the Tenth Doctor from 2005 to 2010. He came back in 2023 as the Fourteenth Doctor."},"options":[{"text":{"en":"David Tennant"},"correct":true},{"text":{"en":"Christopher Eccleston"},"correct":false},{"text":{"en":"Peter Capaldi"},"correct":false},{"text":{"en":"Jodie Whittaker"},"correct":false}]},{"text":{"en":"Who played the Eleventh Doctor?"},"explanation":{"en":"Matt Smith played the Eleventh Doctor from 2010 to 2013."},"options":[{"text":{"en":"Matt Smith"},"correct":true},{"text":{"en":"David Tennant"},"correct":false},{"text":{"en":"Peter Capaldi"},"correct":false},{"text":{"en":"Karen Gillan"},"correct":false}]},{"text":{"en":"Who played the Twelfth Doctor?"},"explanation":{"en":"Peter Capaldi played the Twelfth Doctor from 2014 to 2017."},"options":[{"text":{"en":"Peter Capaldi"},"correct":true},{"text":{"en":"Matt Smith"},"correct":false},{"text":{"en":"Jodie Whittaker"},"correct":false},{"text":{"en":"Ncuti Gatwa"},"correct":false}]},{"text":{"en":"In 2017 it was announced that a woman would play the Doctor as the star of the show for the first time. Who was it?"},"explanation":{"en":"Jodie Whittaker became the Thirteenth Doctor, the first woman to play the Doctor as the main star."},"options":[{"text":{"en":"Jodie Whittaker"},"correct":true},{"text":{"en":"Catherine Tate"},"correct":false},{"text":{"en":"Billie Piper"},"correct":false},{"text":{"en":"Karen Gillan"},"correct":false}]},{"text":{"en":"Who played the Fifteenth Doctor?"},"explanation":{"en":"Ncuti Gatwa first appeared as the Fifteenth Doctor at the end of 'The Giggle' in 2023."},"options":[{"text":{"en":"Ncuti Gatwa"},"correct":true},{"text":{"en":"David Tennant"},"correct":false},{"text":{"en":"Matt Smith"},"correct":false},{"text":{"en":"Pearl Mackie"},"correct":false}]},{"text":{"en":"What does TARDIS stand for?"},"explanation":{"en":"The TARDIS is the Doctor's time machine and spaceship. It is bigger on the inside."},"options":[{"text":{"en":"Time And Relative Dimension In Space"},"correct":true},{"text":{"en":"Travel And Rapid Dimension In Space"},"correct":false},{"text":{"en":"Time And Rocket Dimension In Space"},"correct":false},{"text":{"en":"Transport And Relative Door In Space"},"correct":false}]},{"text":{"en":"Why does the TARDIS look like an old blue police box?"},"explanation":{"en":"The chameleon circuit should let the TARDIS disguise itself, but it is broken, so it stays a police box."},"options":[{"text":{"en":"Its chameleon circuit is broken, so it is stuck in that shape"},"correct":true},{"text":{"en":"The Doctor loves the police"},"correct":false},{"text":{"en":"It was built by the police"},"correct":false},{"text":{"en":"Rose painted it"},"correct":false}]},{"text":{"en":"How many hearts does the Doctor have?"},"explanation":{"en":"Time Lords like the Doctor have two hearts."},"options":[{"text":{"en":"Two"},"correct":true},{"text":{"en":"One"},"correct":false},{"text":{"en":"Three"},"correct":false},{"text":{"en":"Four"},"correct":false}]},{"text":{"en":"What do the Daleks shout when they attack?"},"explanation":{"en":"'Exterminate!' is the Daleks' famous battle cry."},"options":[{"text":{"en":"Exterminate!"},"correct":true},{"text":{"en":"Hello, sweetie!"},"correct":false},{"text":{"en":"Allons-y!"},"correct":false},{"text":{"en":"Geronimo!"},"correct":false}]},{"text":{"en":"What was the name of the very first episode of the new Doctor Who, shown on BBC One in 2005?"},"explanation":{"en":"'Rose' was first shown on 26 March 2005."},"options":[{"text":{"en":"Rose"},"correct":true},{"text":{"en":"The End of the World"},"correct":false},{"text":{"en":"The Empty Child"},"correct":false},{"text":{"en":"Dalek"},"correct":false}]},{"text":{"en":"Who played Rose Tyler, who travels with the Ninth Doctor?"},"explanation":{"en":"Billie Piper played Rose Tyler. Rose travelled with the Ninth Doctor and then the Tenth."},"options":[{"text":{"en":"Billie Piper"},"correct":true},{"text":{"en":"Freema Agyeman"},"correct":false},{"text":{"en":"Catherine Tate"},"correct":false},{"text":{"en":"Karen Gillan"},"correct":false}]},{"text":{"en":"In 'Rose', plastic monsters called Autons attack London. What famous London landmark was their boss using as a transmitter?"},"explanation":{"en":"The Nestene Consciousness controls the Autons and was using the London Eye as a transmitter."},"options":[{"text":{"en":"The London Eye"},"correct":true},{"text":{"en":"Big Ben"},"correct":false},{"text":{"en":"Tower Bridge"},"correct":false},{"text":{"en":"The Shard"},"correct":false}]},{"text":{"en":"In the episode 'Dalek' (2005), where is the lone Dalek being kept?"},"explanation":{"en":"A billionaire called Henry Van Statten kept it in his museum of alien objects."},"options":[{"text":{"en":"In a secret underground museum in Utah"},"correct":true},{"text":{"en":"At the bottom of the River Thames"},"correct":false},{"text":{"en":"Inside the TARDIS"},"correct":false},{"text":{"en":"In a bank in Cardiff"},"correct":false}]},{"text":{"en":"The Doctor believed the Daleks had all been destroyed in a huge war. What was it called?"},"explanation":{"en":"Seeing a Dalek in 'Dalek' shocks the Doctor, because he thought the Last Great Time War had destroyed them."},"options":[{"text":{"en":"The Last Great Time War"},"correct":true},{"text":{"en":"The Great Dalek Invasion"},"correct":false},{"text":{"en":"The Long Cyber War"},"correct":false},{"text":{"en":"The War of the Roses"},"correct":false}]},{"text":{"en":"In 'The Empty Child', a child in a gas mask keeps asking which question?"},"explanation":{"en":"The story is set in London in 1941, during the Blitz."},"options":[{"text":{"en":"Are you my mummy?"},"correct":true},{"text":{"en":"Are you my teacher?"},"correct":false},{"text":{"en":"Where is the TARDIS?"},"correct":false},{"text":{"en":"Who are you?"},"correct":false}]},{"text":{"en":"Captain Jack Harkness, played by John Barrowman, first appears in 'The Empty Child'. Which spin-off series did he later star in?"},"explanation":{"en":"Torchwood was a spin-off series, and Captain Jack was its main character."},"options":[{"text":{"en":"Torchwood"},"correct":true},{"text":{"en":"The Sarah Jane Adventures"},"correct":false},{"text":{"en":"Class"},"correct":false},{"text":{"en":"Jack's Journey"},"correct":false}]},{"text":{"en":"In 'Bad Wolf', the Doctor, Rose and Jack are secretly taken onto Satellite Five. What does it broadcast?"},"explanation":{"en":"The Daleks are secretly behind the game shows."},"options":[{"text":{"en":"Game shows"},"correct":true},{"text":{"en":"Cartoons"},"correct":false},{"text":{"en":"Weather forecasts"},"correct":false},{"text":{"en":"Football matches"},"correct":false}]},{"text":{"en":"At the end of series 1, Rose opens the TARDIS console and takes in the power of what?"},"explanation":{"en":"She uses that power to destroy the Daleks, and spreads the words 'Bad Wolf' across time and space."},"options":[{"text":{"en":"The time vortex"},"correct":true},{"text":{"en":"A Dalek weapon"},"correct":false},{"text":{"en":"A black hole"},"correct":false},{"text":{"en":"The Sun"},"correct":false}]},{"text":{"en":"Just before the Ninth Doctor regenerates, what does he tell Rose she was?"},"explanation":{"en":"'You were fantastic. Absolutely fantastic.' Then he turns into the Tenth Doctor."},"options":[{"text":{"en":"Fantastic"},"correct":true},{"text":{"en":"Brilliant"},"correct":false},{"text":{"en":"Clever"},"correct":false},{"text":{"en":"Brave"},"correct":false}]},{"text":{"en":"What does the Tenth Doctor's catchphrase 'Allons-y!' mean?"},"explanation":{"en":"It is French for 'Let's go!'. You can hear it in 'Army of Ghosts'."},"options":[{"text":{"en":"Let's go!"},"correct":true},{"text":{"en":"Look out!"},"correct":false},{"text":{"en":"Good luck!"},"correct":false},{"text":{"en":"Run away!"},"correct":false}]},{"text":{"en":"In 'School Reunion', the Doctor meets Sarah Jane Smith again, who has an old robot dog. What is it called?"},"explanation":{"en":"K-9 destroys himself to save the day, but the Doctor gives Sarah Jane a brand-new K-9 at the end."},"options":[{"text":{"en":"K-9"},"correct":true},{"text":{"en":"Rex"},"correct":false},{"text":{"en":"Spot"},"correct":false},{"text":{"en":"Metal Mutt"},"correct":false}]},{"text":{"en":"In 'The Girl in the Fireplace', the Doctor meets a girl called Reinette. Which famous French lady does she grow up to be?"},"explanation":{"en":"The Doctor sees her life through 'time windows', starting when she is seven years old."},"options":[{"text":{"en":"Madame de Pompadour"},"correct":true},{"text":{"en":"Queen Victoria"},"correct":false},{"text":{"en":"Joan of Arc"},"correct":false},{"text":{"en":"Cleopatra"},"correct":false}]},{"text":{"en":"In 'Doomsday' (2006), a small group of Daleks escapes. What are they called?"},"explanation":{"en":"The Cult of Skaro escape at the end of 'Doomsday'."},"options":[{"text":{"en":"The Cult of Skaro"},"correct":true},{"text":{"en":"The Dalek Council"},"correct":false},{"text":{"en":"The Silent Squad"},"correct":false},{"text":{"en":"The Black Eagles"},"correct":false}]},{"text":{"en":"In 'Doomsday', Cybermen invade London. Where did they come from?"},"explanation":{"en":"They came from a parallel universe. It is also where Rose ends up, stuck, at the end of the story."},"options":[{"text":{"en":"A parallel universe"},"correct":true},{"text":{"en":"The Moon"},"correct":false},{"text":{"en":"The bottom of the sea"},"correct":false},{"text":{"en":"Ancient Egypt"},"correct":false}]},{"text":{"en":"At the end of 'Planet of the Ood' (2008), what do the freed Ood do?"},"explanation":{"en":"Once the Ood are free, they sing together using their telepathy."},"options":[{"text":{"en":"They sing together"},"correct":true},{"text":{"en":"They fly away in a spaceship"},"correct":false},{"text":{"en":"They build a statue of the Doctor"},"correct":false},{"text":{"en":"They chase the Daleks"},"correct":false}]},{"text":{"en":"In 'Smith and Jones' (2007), the Royal Hope Hospital is taken somewhere very strange. Where?"},"explanation":{"en":"Martha Jones, played by Freema Agyeman, joins the Doctor after this adventure."},"options":[{"text":{"en":"The Moon"},"correct":true},{"text":{"en":"Mars"},"correct":false},{"text":{"en":"Skaro"},"correct":false},{"text":{"en":"The bottom of the sea"},"correct":false}]},{"text":{"en":"When she meets the Doctor, what is Martha Jones studying to become?"},"explanation":{"en":"Martha is a medical student."},"options":[{"text":{"en":"A doctor"},"correct":true},{"text":{"en":"A pilot"},"correct":false},{"text":{"en":"A teacher"},"correct":false},{"text":{"en":"A police officer"},"correct":false}]},{"text":{"en":"Who wrote 'Blink' (2007), the scary episode with the Weeping Angels?"},"explanation":{"en":"The Weeping Angels only move when nobody is looking, which is why the story's warning is 'Don't blink!'"},"options":[{"text":{"en":"Steven Moffat"},"correct":true},{"text":{"en":"Russell T Davies"},"correct":false},{"text":{"en":"Neil Gaiman"},"correct":false},{"text":{"en":"Richard Curtis"},"correct":false}]},{"text":{"en":"Which actor played the Master, the main villain of series 3 in 2007?"},"explanation":{"en":"John Simm played the Master from 2007 to 2010."},"options":[{"text":{"en":"John Simm"},"correct":true},{"text":{"en":"Michelle Gomez"},"correct":false},{"text":{"en":"Sacha Dhawan"},"correct":false},{"text":{"en":"David Tennant"},"correct":false}]},{"text":{"en":"How does Donna Noble first appear in the TARDIS?"},"explanation":{"en":"Donna, played by Catherine Tate, appears at the end of 'Doomsday'. Then she is 'The Runaway Bride' in the Christmas special."},"options":[{"text":{"en":"In a wedding dress"},"correct":true},{"text":{"en":"Dressed as a Dalek"},"correct":false},{"text":{"en":"In a space suit"},"correct":false},{"text":{"en":"Covered in mud"},"correct":false}]},{"text":{"en":"In 'The Fires of Pompeii' (2008), Peter Capaldi plays a character before he became the Twelfth Doctor. Which one?"},"explanation":{"en":"Karen Gillan was in the same episode as a soothsayer, before she played Amy Pond."},"options":[{"text":{"en":"Caecilius"},"correct":true},{"text":{"en":"Rassilon"},"correct":false},{"text":{"en":"The Master"},"correct":false},{"text":{"en":"Davros"},"correct":false}]},{"text":{"en":"What famous word does River Song use to mean 'I can't tell you what happens next'?"},"explanation":{"en":"River Song, played by Alex Kingston, first appeared in 'Silence in the Library' in 2008."},"options":[{"text":{"en":"Spoilers!"},"correct":true},{"text":{"en":"Geronimo!"},"correct":false},{"text":{"en":"Fantastic!"},"correct":false},{"text":{"en":"Allons-y!"},"correct":false}]},{"text":{"en":"What are the Tenth Doctor's last words before he regenerates in 'The End of Time'?"},"explanation":{"en":"He regenerates into the Eleventh Doctor, played by Matt Smith."},"options":[{"text":{"en":"I don't want to go"},"correct":true},{"text":{"en":"Allons-y!"},"correct":false},{"text":{"en":"Goodbye, Rose"},"correct":false},{"text":{"en":"I'm sorry"},"correct":false}]},{"text":{"en":"In 2010, which Doctor said 'Bow ties are cool' in his very first episode?"},"explanation":{"en":"Matt Smith's Doctor says it in his first episode, 'The Eleventh Hour' (2010)."},"options":[{"text":{"en":"The Eleventh Doctor"},"correct":true},{"text":{"en":"The Ninth Doctor"},"correct":false},{"text":{"en":"The Tenth Doctor"},"correct":false},{"text":{"en":"The Twelfth Doctor"},"correct":false}]},{"text":{"en":"In 'The Eleventh Hour', the new Doctor meets young Amelia Pond in which English village?"},"explanation":{"en":"Years later, Amelia has grown up into Amy Pond, played by Karen Gillan."},"options":[{"text":{"en":"Leadworth"},"correct":true},{"text":{"en":"Ambridge"},"correct":false},{"text":{"en":"Hogsmeade"},"correct":false},{"text":{"en":"Sheffield"},"correct":false}]},{"text":{"en":"In 'Vincent and the Doctor', the Doctor and Amy meet which famous painter?"},"explanation":{"en":"The story was written by Richard Curtis."},"options":[{"text":{"en":"Vincent van Gogh"},"correct":true},{"text":{"en":"Pablo Picasso"},"correct":false},{"text":{"en":"Leonardo da Vinci"},"correct":false},{"text":{"en":"Claude Monet"},"correct":false}]},{"text":{"en":"In 'The Doctor's Wife' (2011), who turns out to be the Doctor's 'wife'?"},"explanation":{"en":"The TARDIS appears as a woman called Idris, played by Suranne Jones. The story was written by Neil Gaiman."},"options":[{"text":{"en":"The TARDIS, in a human body"},"correct":true},{"text":{"en":"Rose Tyler"},"correct":false},{"text":{"en":"Donna Noble"},"correct":false},{"text":{"en":"Martha Jones"},"correct":false}]},{"text":{"en":"In 'The Angels Take Manhattan', which monsters trap Amy and Rory in New York in the 1930s?"},"explanation":{"en":"It is the last story for Amy and Rory."},"options":[{"text":{"en":"The Weeping Angels"},"correct":true},{"text":{"en":"The Daleks"},"correct":false},{"text":{"en":"The Cybermen"},"correct":false},{"text":{"en":"The Ood"},"correct":false}]},{"text":{"en":"Who played the War Doctor in the 50th anniversary special 'The Day of the Doctor' (2013)?"},"explanation":{"en":"It was shown at the same time in many countries in November 2013, with David Tennant and Matt Smith too."},"options":[{"text":{"en":"John Hurt"},"correct":true},{"text":{"en":"Peter Capaldi"},"correct":false},{"text":{"en":"David Bradley"},"correct":false},{"text":{"en":"Christopher Eccleston"},"correct":false}]},{"text":{"en":"In 'The Day of the Doctor', the War Doctor uses a weapon from the Time War. What is it called?"},"explanation":{"en":"In the story, the Moment takes the form of a woman played by Billie Piper."},"options":[{"text":{"en":"The Moment"},"correct":true},{"text":{"en":"The Hour"},"correct":false},{"text":{"en":"The Pandorica"},"correct":false},{"text":{"en":"The Big Bang"},"correct":false}]},{"text":{"en":"In 'The Time of the Doctor' (2013), on which planet does the Eleventh Doctor spend hundreds of years defending against aliens?"},"explanation":{"en":"Clara persuades the Time Lords to give him new regenerations, and he becomes the Twelfth Doctor."},"options":[{"text":{"en":"Trenzalore"},"correct":true},{"text":{"en":"Skaro"},"correct":false},{"text":{"en":"Mars"},"correct":false},{"text":{"en":"The Moon"},"correct":false}]},{"text":{"en":"What nickname does the Doctor give Clara Oswald, played by Jenna Coleman?"},"explanation":{"en":"Clara travelled with the Eleventh Doctor and then the Twelfth."},"options":[{"text":{"en":"The Impossible Girl"},"correct":true},{"text":{"en":"The Lost Girl"},"correct":false},{"text":{"en":"The Clever Girl"},"correct":false},{"text":{"en":"The Time Girl"},"correct":false}]},{"text":{"en":"What does the female version of the Master call herself?"},"explanation":{"en":"Missy was played by Michelle Gomez, the first woman to play the Master."},"options":[{"text":{"en":"Missy"},"correct":true},{"text":{"en":"Moxie"},"correct":false},{"text":{"en":"Madam Zeta"},"correct":false},{"text":{"en":"Mrs Clara"},"correct":false}]},{"text":{"en":"In 'World Enough and Time', what happens to Bill Potts, played by Pearl Mackie?"},"explanation":{"en":"Bill is the Twelfth Doctor's companion. She comes back in 'Twice Upon a Time'."},"options":[{"text":{"en":"She is turned into a Cyberman"},"correct":true},{"text":{"en":"She becomes a Dalek"},"correct":false},{"text":{"en":"She turns into a Weeping Angel"},"correct":false},{"text":{"en":"She flies away in a rocket"},"correct":false}]},{"text":{"en":"In 'Spyfall' (2020), a friendly spy boss called 'O' turns out to be the Master. Which spy agency does he seem to work for?"},"explanation":{"en":"Sacha Dhawan, who plays him, is the youngest actor to play the Master."},"options":[{"text":{"en":"MI6"},"correct":true},{"text":{"en":"The FBI"},"correct":false},{"text":{"en":"UNIT"},"correct":false},{"text":{"en":"Torchwood"},"correct":false}]},{"text":{"en":"Graham, Ryan and Yaz travel with the Thirteenth Doctor. Which English city do they come from?"},"explanation":{"en":"The Thirteenth Doctor's first story, 'The Woman Who Fell to Earth', takes place in Sheffield."},"options":[{"text":{"en":"Sheffield"},"correct":true},{"text":{"en":"Manchester"},"correct":false},{"text":{"en":"London"},"correct":false},{"text":{"en":"Liverpool"},"correct":false}]},{"text":{"en":"What do the Thirteenth Doctor and her friends call their team?"},"explanation":{"en":"They take the name after Graham, Ryan and Yaz choose to keep travelling with the Doctor."},"options":[{"text":{"en":"Team TARDIS"},"correct":true},{"text":{"en":"The Time Squad"},"correct":false},{"text":{"en":"The Police Box Gang"},"correct":false},{"text":{"en":"Team Gallifrey"},"correct":false}]},{"text":{"en":"In 'Fugitive of the Judoon' (2020), a woman called Ruth Clayton is revealed to be what?"},"explanation":{"en":"She is the Fugitive Doctor, played by Jo Martin, the first Black actor to play the Doctor in the main show."},"options":[{"text":{"en":"A previously unseen version of the Doctor"},"correct":true},{"text":{"en":"A Judoon in disguise"},"correct":false},{"text":{"en":"The Master's sister"},"correct":false},{"text":{"en":
